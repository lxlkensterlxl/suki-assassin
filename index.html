<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SukiBot // CYBER HUD & ANIME AVATAR ENGINE</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <!-- WebLLM Engine CDN Module Import with Error Guard -->
    <script type="module">
        try {
            const webLLM = await import("https://esm.run/@mlc-ai/web-llm");
            window.webLLM = webLLM;
            window.dispatchEvent(new CustomEvent('mlc-loaded'));
        } catch (err) {
            console.warn("WebLLM CDN module failed to load:", err);
            window.webLLMError = err;
        }
    </script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyberDark: '#05030a',
                        cyberPanel: '#0d0718',
                        cyberCard: '#140c26',
                        cyberBorder: '#2a164d',
                        cyberPurple: '#a855f7',
                        cyberPink: '#ec4899',
                        cyberCyan: '#06b6d4',
                        cyberNeonPink: '#ff2a8d',
                        cyberNeonCyan: '#00f0ff',
                        cyberNeonPurple: '#bf5af2',
                        cyberYellow: '#ffe600'
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        rajdhani: ['Rajdhani', 'sans-serif'],
                        mono: ['Share Tech Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }
        body {
            background-color: #030207;
            color: #e2e8f0;
            font-family: 'Rajdhani', sans-serif;
            user-select: none;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(13, 7, 24, 0.8);
        }
        ::-webkit-scrollbar-thumb {
            background: #ff2a8d;
            border-radius: 4px;
        }

        .hud-card {
            background: rgba(16, 9, 32, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(191, 90, 242, 0.35);
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0, 0, 0, 0.5) 50%,
                rgba(0, 0, 0, 0.5)
            );
            background-size: 100% 4px;
        }

        .matrix-bg {
            background-image: radial-gradient(rgba(0, 240, 255, 0.12) 1px, transparent 0);
            background-size: 16px 16px;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(255, 42, 141, 0.8); }
            70% { box-shadow: 0 0 0 14px rgba(255, 42, 141, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 42, 141, 0); }
        }
        .mic-listening {
            animation: pulseGlow 1.4s infinite;
            background-color: #ff2a8d !important;
            color: #ffffff !important;
            border-color: #00f0ff !important;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .cyber-corner {
            position: relative;
        }
        .cyber-corner::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            width: 8px;
            height: 8px;
            border-top: 2px solid #00f0ff;
            border-left: 2px solid #00f0ff;
            z-index: 25;
        }
        .cyber-corner::after {
            content: '';
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 8px;
            height: 8px;
            border-bottom: 2px solid #ff2a8d;
            border-right: 2px solid #ff2a8d;
            z-index: 25;
        }

        .equalizer-bar {
            height: 20%;
            transition: height 0.08s ease-out;
        }
        
        .speaking-active .equalizer-bar {
            animation: bounce 0.35s ease-in-out infinite alternate;
        }
        .speaking-active .equalizer-bar:nth-child(2) { animation-delay: 0.08s; }
        .speaking-active .equalizer-bar:nth-child(3) { animation-delay: 0.16s; }
        .speaking-active .equalizer-bar:nth-child(4) { animation-delay: 0.24s; }
        .speaking-active .equalizer-bar:nth-child(5) { animation-delay: 0.12s; }

        @keyframes bounce {
            0% { height: 15%; }
            100% { height: 100%; }
        }

        .glitch-text {
            text-shadow: 2px 0 #00f0ff, -2px 0 #ff2a8d;
        }
    </style>
</head>
<body class="min-h-dvh flex items-center justify-center p-0 sm:p-4 bg-slate-950">

    <!-- Screen Layout Wrapper -->
    <div id="app-viewport" class="relative w-full max-w-[440px] sm:max-w-[480px] h-[100dvh] sm:h-[910px] bg-black sm:rounded-[48px] p-2 sm:p-3 shadow-[0_0_70px_rgba(255,42,141,0.3)] border-0 sm:border-4 border-slate-900 flex flex-col overflow-hidden transition-all duration-300">
        
        <!-- Dynamic Island / Top Notch -->
        <div class="absolute top-3 left-1/2 -translate-x-1/2 w-32 h-6 bg-black rounded-full z-50 flex items-center justify-between px-3 border border-slate-800 shadow-md">
            <div class="w-2.5 h-2.5 rounded-full bg-slate-900 border border-slate-700 flex items-center justify-center">
                <div id="notch-dot" class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse"></div>
            </div>
            <span class="font-mono text-[9px] text-pink-400 tracking-tighter">SUKI_CORE v2</span>
            <div id="notch-speaker" class="w-2 h-1 rounded-full bg-purple-600/80"></div>
        </div>

        <!-- Inner Cyber Container -->
        <div class="relative w-full h-full bg-[#06030c] rounded-[32px] sm:rounded-[38px] flex flex-col overflow-hidden border border-pink-500/30">
            
            <!-- Scanlines & Matrix Overlays -->
            <div id="scanlines-layer" class="absolute inset-0 scanlines pointer-events-none z-40 opacity-25"></div>
            <div id="matrix-layer" class="absolute inset-0 matrix-bg pointer-events-none z-10"></div>

            <!-- Header HUD -->
            <header class="relative z-30 pt-8 px-4 pb-2 border-b border-purple-500/30 bg-cyberDark/90 flex justify-between items-center backdrop-blur-md">
                <div>
                    <div class="flex items-center space-x-2">
                        <h1 class="font-orbitron font-extrabold text-sm tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-pink-500 to-purple-400 glitch-text">
                            SUKIBOT // v2.0
                        </h1>
                        <span id="engine-badge" class="px-1.5 py-0.5 rounded text-[9px] font-mono bg-cyan-950 border border-cyan-500/50 text-cyan-300">DEMO</span>
                    </div>
                    <p class="font-mono text-[10px] text-cyan-400/80 flex items-center gap-1">
                        STATUS: <span id="status-text" class="text-pink-400 font-bold">READY</span>
                    </p>
                </div>
                
                <div class="flex items-center space-x-1.5">
                    <!-- 5-Bar Equalizer -->
                    <div id="equalizer" class="flex items-end space-x-0.5 h-4 w-8 px-1 border border-purple-500/30 rounded bg-cyberCard">
                        <div class="equalizer-bar w-1 bg-cyan-400 rounded-full"></div>
                        <div class="equalizer-bar w-1 bg-pink-500 rounded-full"></div>
                        <div class="equalizer-bar w-1 bg-purple-500 rounded-full"></div>
                        <div class="equalizer-bar w-1 bg-cyan-400 rounded-full"></div>
                        <div class="equalizer-bar w-1 bg-pink-400 rounded-full"></div>
                    </div>
                    
                    <!-- HUD Controls Buttons -->
                    <button id="toggle-debug-btn" title="Toggle Rig Anchor Debug" class="w-7 h-7 rounded bg-cyberCard border border-purple-500/40 text-slate-400 hover:text-yellow-300 text-xs flex items-center justify-center transition">
                        <i class="fa-solid fa-crosshairs"></i>
                    </button>
                    <button id="toggle-sound-btn" title="Toggle Sound FX" class="w-7 h-7 rounded bg-cyberCard border border-purple-500/40 text-cyan-400 hover:text-pink-400 text-xs flex items-center justify-center transition">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                    <button id="toggle-scanlines-btn" title="Toggle Scanlines" class="w-7 h-7 rounded bg-cyberCard border border-purple-500/40 text-cyan-400 hover:text-pink-400 text-xs flex items-center justify-center transition">
                        <i class="fa-solid fa-tv"></i>
                    </button>
                    <button id="expand-frame-btn" title="Expand View" class="hidden sm:flex w-7 h-7 rounded bg-cyberCard border border-purple-500/40 text-cyan-400 hover:text-pink-400 text-xs items-center justify-center transition">
                        <i class="fa-solid fa-expand"></i>
                    </button>
                </div>
            </header>

            <!-- Model Selection Bar / Download HUD -->
            <section class="relative z-30 px-3 py-1.5 bg-cyberPanel/90 border-b border-purple-500/20 flex flex-col space-y-1 font-mono text-[11px]">
                <div class="flex justify-between items-center">
                    <label for="model-select" class="text-pink-400 text-[10px]">AI ENGINE MODEL:</label>
                    <select id="model-select" class="bg-cyberDark border border-cyan-500/40 text-cyan-300 text-[10px] rounded px-1.5 py-0.5 focus:outline-none">
                        <option value="simulated">⚡ FAST DEMO SIMULATOR (No VRAM requirement)</option>
                        <option value="Qwen2.5-0.5B-Instruct-q4f16_1-MLC">Qwen 2.5 0.5B (Fast WebGPU)</option>
                        <option value="Llama-3.2-1B-Instruct-q4f16_1-MLC">Llama 3.2 1B (High Quality WebGPU)</option>
                        <option value="SmolLM2-360M-Instruct-q4f16_1-MLC">SmolLM2 360M (Ultra Lightweight)</option>
                    </select>
                </div>
                
                <!-- Model Download Bar -->
                <div id="download-progress-container" class="hidden flex-col space-y-0.5">
                    <div class="flex justify-between text-[9px] text-cyan-300">
                        <span id="progress-text">Initializing Model Engine...</span>
                        <span id="progress-percent">0%</span>
                    </div>
                    <div class="w-full h-1.5 bg-cyberDark rounded-full overflow-hidden border border-cyan-500/30">
                        <div id="progress-bar" class="h-full bg-gradient-to-r from-cyan-400 to-pink-500 w-0 transition-all duration-200"></div>
                    </div>
                </div>
            </section>

            <!-- Interactive Anime Cyber Avatar Canvas Section -->
            <div class="relative w-full h-64 sm:h-72 bg-gradient-to-b from-cyberDark via-cyberCard to-cyberPanel border-b border-purple-500/30 flex items-center justify-center overflow-hidden">
                <canvas id="avatar-canvas" class="w-full h-full z-20 cursor-pointer touch-none"></canvas>
                
                <!-- Telemetry & Diagnostic HUD Overlay -->
                <div class="absolute top-2 left-2 z-20 font-mono text-[9px] text-cyan-400/90 pointer-events-none space-y-0.5 bg-black/50 p-1.5 rounded border border-cyan-500/20">
                    <div>FPS: <span id="fps-counter" class="text-pink-400">60</span></div>
                    <div>ASSET: <span id="asset-status" class="text-green-400">LOADING</span></div>
                    <div>NEURAL SYNC: <span id="neural-sync" class="text-cyan-300">100%</span></div>
                </div>

                <div class="absolute top-2 right-2 z-20 font-mono text-[9px] text-pink-400/90 pointer-events-none bg-black/50 p-1.5 rounded border border-pink-500/20 text-right">
                    <div>MODE: <span id="avatar-state" class="text-cyan-300">IDLE</span></div>
                    <div>GPU: <span id="gpu-status" class="text-purple-300">CHECKING</span></div>
                </div>

                <div class="absolute bottom-1 right-2 z-20 font-mono text-[9px] text-slate-400 pointer-events-none">
                    TAP AVATAR TO SWITCH MODE
                </div>
            </div>

            <!-- Chat Output Container -->
            <main id="chat-box" class="relative z-30 flex-1 overflow-y-auto p-3 space-y-2.5 font-rajdhani text-sm no-scrollbar
