<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sukibot — Goth Ninja AI & Self-Improving Code Lab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Cinzel:wght@600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
            display: ['Cinzel', 'serif'],
          },
          colors: {
            void: '#08050d',
            obsidian: '#110a1c',
            crypt: '#190f29',
            neonGreen: '#39ff14',
            acidMint: '#22ff55',
            neonPurple: '#b026ff',
            cyberLilac: '#c084fc',
          }
        }
      }
    };
  </script>
  <style>
    :root {
      --accent-primary: #39ff14;
      --accent-secondary: #b026ff;
      --blade-glow: #39ff14;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #08050d;
      color: #f5e9ff;
      overflow-x: hidden;
    }

    /* Cute gothic midnight cyber grid with neon green & neon purple glow */
    .cyber-dojo-bg {
      background-color: #08050d;
      background-image:
        radial-gradient(circle at 18% 15%, rgba(57, 255, 20, 0.14) 0%, transparent 45%),
        radial-gradient(circle at 82% 20%, rgba(176, 38, 255, 0.22) 0%, transparent 48%),
        radial-gradient(circle at 50% 90%, rgba(192, 132, 252, 0.11) 0%, transparent 52%),
        linear-gradient(to right, rgba(176, 38, 255, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(57, 255, 20, 0.05) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 36px 36px, 36px 36px;
    }

    /* Character idle float & breathing */
    @keyframes floatBreath {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-6px);
      }
    }

    @keyframes twinTailLeft {
      0%, 100% {
        transform: rotate(0deg);
      }
      50% {
        transform: rotate(3.2deg);
      }
    }

    @keyframes twinTailRight {
      0%, 100% {
        transform: rotate(0deg);
      }
      50% {
        transform: rotate(-3.2deg);
      }
    }

    @keyframes katanaSlash {
      0% {
        transform: rotate(0deg) translate(0px, 0px);
      }
      22% {
        transform: rotate(-34deg) translate(-8px, -6px);
      }
      48% {
        transform: rotate(68deg) translate(16px, 8px);
      }
      75% {
        transform: rotate(12deg) translate(4px, 2px);
      }
      100% {
        transform: rotate(0deg) translate(0px, 0px);
      }
    }

    @keyframes slashArcAnim {
      0% {
        opacity: 0;
        transform: scale(0.75) rotate(-18deg);
      }
      25% {
        opacity: 0.95;
        transform: scale(1.02) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: scale(1.18) rotate(12deg);
      }
    }

    @keyframes pulseAura {
      0%, 100% {
        opacity: 0.45;
        transform: scale(0.98);
      }
      50% {
        opacity: 0.8;
        transform: scale(1.04);
      }
    }

    .sukibot-body-anim {
      animation: floatBreath 3.6s ease-in-out infinite;
      transform-origin: center bottom;
    }

    .twintail-left {
      transform-box: fill-box;
      transform-origin: top center;
      animation: twinTailLeft 3.2s ease-in-out infinite;
    }

    .twintail-right {
      transform-box: fill-box;
      transform-origin: top center;
      animation: twinTailRight 3.2s ease-in-out infinite;
    }

    .katana-group {
      transform-box: fill-box;
      transform-origin: 24% 82%;
      transition: transform 0.25s ease;
    }

    .katana-slashing {
      animation: katanaSlash 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .slash-arc {
      transform-box: fill-box;
      transform-origin: center;
      opacity: 0;
    }

    .slash-arc-active {
      animation: slashArcAnim 0.62s ease-out forwards;
    }

    .aura-ring {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulseAura 4s ease-in-out infinite;
    }

    /* Custom sleek scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(17, 13, 24, 0.7);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(176, 38, 255, 0.45);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(57, 255, 20, 0.75);
    }
  </style>
</head>
<body class="cyber-dojo-bg min-h-screen text-purple-50 selection:bg-[#39ff14]/25 selection:text-[#39ff14]">
  <!-- App Container -->
  <div id="app" class="max-w-[1440px] mx-auto px-3 sm:px-5 py-4 space-y-4">
    <!-- Top Header Bar -->
    <header class="rounded-2xl bg-obsidian/90 border border-[#b026ff]/40 backdrop-blur-md px-4 py-3 flex flex-wrap items-center justify-between gap-3 shadow-lg shadow-[#b026ff]/15">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#b026ff]/30 via-[#190f29] to-[#39ff14]/25 border border-[#39ff14]/50 flex items-center justify-center shadow-inner">
          <!-- Mini Goth Kunai / Crescent SVG
