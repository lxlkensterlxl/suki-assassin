    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
        import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
        import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

        let scene, camera, renderer, clock, controls, currentVrm;
        let sukiAvatarGroup, sukiMouth, sukiHairBunsGroup;
        let isAvatarSpeaking = false;
        let isGenerating = false;
        let isChatCollapsed = false;
        let webllmEngine = null;
        let matrixCanvas, matrixCtx, matrixColumns, matrixDrops, matrixIntervalId;

        const matrixChars = "SUKI0123456789🌸✨💖⭐💫";
        const DEFAULT_ENGINE = 'pollinations:openai';
        const STORAGE_KEY_ENGINE = 'suki_free_ai_engine';
        const STORAGE_KEY_HISTORY = 'suki_chat_history_v1';
        const SUKI_SYSTEM_PROMPT = "You are Suki, a cheerful, witty, cute anime companion. Keep replies concise, expressive, and helpful.";

        function loadHistory() {
            const sysMsg = { role: 'system', content: SUKI_SYSTEM_PROMPT };
            try {
                const raw = localStorage.getItem(STORAGE_KEY_HISTORY);
                if (!raw) return [sysMsg];
                const parsed = JSON.parse(raw);
                if (!Array.isArray(parsed) || parsed.length === 0) return [sysMsg];
                const filtered = parsed.filter(
                    m => m && (m.role === 'user' || m.role === 'assistant') && typeof m.content === 'string'
                );
                return [sysMsg, ...filtered.slice(-16)];
            } catch {
                return [sysMsg];
            }
        }

        const chatHistory = loadHistory();

        function saveHistory() {
            try {
                const nonSystem = chatHistory.filter(m => m.role !== 'system').slice(-16);
                localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(nonSystem));
            } catch {
                // Ignore storage quota errors
            }
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function setStageLoading(visible, message = 'Summoning Cute Anime Suki...') {
            const overlay = document.getElementById('stage-loading');
            const label = document.getElementById('stage-loading-text');
            if (label) label.textContent = message;
            if (overlay) overlay.classList.toggle('hidden', !visible);
        }

        function updateEngineBadge() {
            const engine = localStorage.getItem(STORAGE_KEY_ENGINE) || DEFAULT_ENGINE;
            const badge = document.getElementById('active-engine-badge');
            const labels = {
                'pollinations:openai': 'FREE GPT-4O-MINI',
                'pollinations:mistral': 'FREE MISTRAL',
                'pollinations:llama': 'FREE LLAMA-70B',
                'webllm:Llama-3.2-1B-Instruct-q4f16_1-MLC': 'LOCAL WEBGPU'
            };
            if (badge) badge.textContent = labels[engine] || 'FREE AI READY';
        }

        // Frame full body vertically regardless of portrait/landscape aspect ratio
        function frameFullBody(height = 1.7) {
            const container = document.getElementById('vrm-canvas-holder');
            const aspect = Math.max(container.clientWidth, 1) / Math.max(container.clientHeight, 1);
            const fovRad = THREE.MathUtils.degToRad(camera.fov);

            // Calculate distance needed so full height + padding fits in vertical FOV
            const paddedHeight = height * 1.32;
            let distance = (paddedHeight / 2) / Math.tan(fovRad / 2);

            // On very narrow screens, pull slightly further back so outstretched arms fit too
            if (aspect < 0.65) {
                distance *= 1.18;
            }

            // Shift look-at target slightly lower so her feet clear the bottom chat bar
            const targetY = height * 0.44;
            controls.target.set(0, targetY, 0);
            camera.position.set(0, targetY + 0.12, distance);
            camera.lookAt(0, targetY, 0);
            controls.update();
        }

        function initMatrix() {
            matrixCanvas = document.getElementById('matrix-canvas');
            matrixCtx = matrixCanvas.getContext('2d');
            resizeMatrix();
            window.addEventListener('resize', resizeMatrix);

            const startMatrix = () => {
                if (!matrixIntervalId) {
                    matrixIntervalId = setInterval(drawMatrix, 45);
                }
            };
            const stopMatrix = () => {
                if (matrixIntervalId) {
                    clearInterval(matrixIntervalId);
                    matrixIntervalId = null;
                }
            };

            startMatrix();
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    stopMatrix();
                } else {
                    startMatrix();
                }
            });
        }

        function resizeMatrix() {
            matrixCanvas.width = window.innerWidth;
            matrixCanvas.height = window.innerHeight;
            const fontSize = 14;
            matrixColumns = Math.max(1, Math.floor(matrixCanvas.width / fontSize));
            matrixDrops = Array.from({ length: matrixColumns }, () => Math.random() * 40);
        }

        function drawMatrix() {
            matrixCtx.fillStyle = 'rgba(5, 3, 8, 0.08)';
            matrixCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
            matrixCtx.fillStyle = '#ec4899';
            matrixCtx.font = '14px monospace';
            for (let i = 0; i < matrixDrops.length; i++) {
                const text = matrixChars[Math.floor(Math.random() * matrixChars.length)];
                matrixCtx.fillText(text, i * 14, matrixDrops[i] * 14);
                if (matrixDrops[i] * 14 > matrixCanvas.height && Math.random() > 0.975) {
                    matrixDrops[i] = 0;
                }
                matrixDrops[i]++;
            }
        }

        function createFallbackSuki() {
            sukiAvatarGroup = new THREE.Group();
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffe4dc, roughness: 0.6 });
            const hairMat = new THREE.MeshStandardMaterial({ color: 0xf472b6, roughness: 0.4 });
            const outfitMat = new THREE.MeshStandardMaterial({ color: 0x1e1136, roughness: 0.5 });

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.32, 24, 24), skinMat);
            head.position.y = 1.48;
            sukiAvatarGroup.add(head);

            sukiHairBunsGroup = new THREE.Group();
            const leftBun = new THREE.Mesh(new THREE.SphereGeometry(0.14, 16, 16), hairMat);
            leftBun.position.set(-0.34, 1.68, -0.04);
            const rightBun = new THREE.Mesh(new THREE.SphereGeometry(0.14, 16, 16), hairMat);
            rightBun.position.set(0.34, 1.68, -0.04);
            sukiHairBunsGroup.add(leftBun, rightBun);
            sukiAvatarGroup.add(sukiHairBunsGroup);

            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x06b6d4 });
            const leftEye = new THREE.Mesh(new THREE.SphereGeometry(0.045, 12, 12), eyeMat);
            leftEye.position.set(-0.11, 1.50, 0.29);
            const rightEye = new THREE.Mesh(new THREE.SphereGeometry(0.045, 12, 12), eyeMat);
            rightEye.position.set(0.11, 1.50, 0.29);
            sukiAvatarGroup.add(leftEye, rightEye);

            sukiMouth = new THREE.Mesh(
                new THREE.BoxGeometry(0.09, 0.03, 0.03),
                new THREE.MeshBasicMaterial({ color: 0xf43f5e })
            );
            sukiMouth.position.set(0, 1.38, 0.30);
            sukiAvatarGroup.add(sukiMouth);

            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.28, 0.62, 20), outfitMat);
            body.position.y = 0.88;
            sukiAvatarGroup.add(body);

            // Legs & boots so fallback Suki is also full-body
            const legGeo = new THREE.CylinderGeometry(0.065, 0.055, 0.56, 14);
            const leftLeg = new THREE.Mesh(legGeo, skinMat);
            leftLeg.position.set(-0.10, 0.30, 0);
            const rightLeg = new THREE.Mesh(legGeo, skinMat);
            rightLeg.position.set(0.10, 0.30, 0);

            const bootGeo = new THREE.CylinderGeometry(0.065, 0.075, 0.22, 14);
            const leftBoot = new THREE.Mesh(bootGeo, hairMat);
            leftBoot.position.set(-0.10, 0.11, 0.02);
            const rightBoot = new THREE.Mesh(bootGeo, hairMat);
            rightBoot.position.set(0.10, 0.11, 0.02);

            sukiAvatarGroup.add(leftLeg, rightLeg, leftBoot, rightBoot);

            scene.add(sukiAvatarGroup);
            frameFullBody(1.8);
            setStageLoading(false);
        }

        function initStage() {
            const container = document.getElementById('vrm-canvas-holder');
            scene = new THREE.Scene();
            clock = new THREE.Clock();

            const width = Math.max(container.clientWidth, 1);
            const height = Math.max(container.clientHeight, 1);
            camera = new THREE.PerspectiveCamera(35, width / height, 0.1, 100);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const ambient = new THREE.AmbientLight(0xffffff, 0.85);
            const keyLight = new THREE.DirectionalLight(0xff9ad5, 1.2);
            keyLight.position.set(2, 4, 3);
            scene.add(ambient, keyLight);

            createFallbackSuki();

            window.addEventListener('resize', () => {
                const w = Math.max(container.clientWidth, 1);
                const h = Math.max(container.clientHeight, 1);
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
                renderer.setSize(w, h);
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.05);
            const elapsed = clock.elapsedTime;

            if (currentVrm) {
                if (currentVrm.expressionManager) {
                    const blinkCycle = Math.sin(elapsed * 0.9);
                    currentVrm.expressionManager.setValue('blink', blinkCycle > 0.985 ? 1.0 : 0.0);
                    const talkVal = isAvatarSpeaking ? Math.abs(Math.sin(elapsed * 15)) * 0.75 : 0.0;
                    currentVrm.expressionManager.setValue('aa', talkVal);
                }
                currentVrm.update(delta);
            } else if (sukiAvatarGroup) {
                sukiAvatarGroup.position.y = Math.sin(elapsed * 2.2) * 0.025;
                if (sukiHairBunsGroup) {
                    sukiHairBunsGroup.rotation.z = Math.sin(elapsed * 3) * 0.05;
                }
                if (sukiMouth) {
                    const talkScale = isAvatarSpeaking ? 1 + Math.abs(Math.sin(elapsed * 16)) * 2.5 : 1;
                    sukiMouth.scale.y = talkScale;
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        function expandChatIfCollapsed() {
            if (!isChatCollapsed) return;
            isChatCollapsed = false;
            const msgBox = document.getElementById('chat-messages');
            const icon = document.getElementById('toggle-chat-icon');
            msgBox.classList.remove('hidden');
            icon.style.transform = 'rotate(0deg)';
        }

        function appendMessage(sender, text, isUser = false) {
            expandChatIfCollapsed();
            const chatBox = document.getElementById('chat-messages');
            const row = document.createElement('div');
            row.className = `flex space-x-2 ${isUser ? 'justify-end' : ''}`;

            const safeMarkdown = escapeHtml(text);
            const rendered = window.marked ? window.marked.parse(safeMarkdown) : safeMarkdown;

            row.innerHTML = isUser
                ? `<div class="bg-pink-600/35 border border-pink-500/40 p-2 rounded-xl text-white leading-snug max-w-[85%]">${rendered}</div>`
                : `<div class="w-5 h-5 rounded-full bg-pink-600 shrink-0 flex items-center justify-center font-black text-[10px] text-white">🌸</div>
                   <div class="bg-[#1e1136]/80 border border-pink-500/30 p-2 rounded-xl text-pink-100 leading-snug shadow-md prose-suki max-w-[85%]">
                       <span class="text-pink-400 font-bold uppercase tracking-wider block text-[9px] mb-0.5">${escapeHtml(sender)}</span>
                       ${rendered}
                   </div>`;

            chatBox.appendChild(row);
            chatBox.scrollTop = chatBox.scrollHeight;
            return row;
        }

        function hydrateChatUI() {
            const chatBox = document.getElementById('chat-messages');
            chatBox.innerHTML = '';
            const savedMessages = chatHistory.filter(m => m.role !== 'system');
            if (savedMessages.length === 0) {
                appendMessage('Suki 🌸', 'Hello Master! Full-body stage mode is active—tap the arrow in my chat bar anytime to collapse or expand chat! ✨');
                return;
            }
            for (const msg of savedMessages) {
                if (msg.role === 'user') {
                    appendMessage('You', msg.content, true);
                } else if (msg.role === 'assistant') {
                    appendMessage('Suki 🌸', msg.content, false);
                }
            }
        }

        async function queryPollinations(modelName) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 25000);

            try {
                const res = await fetch('https://text.pollinations.ai/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    signal: controller.signal,
                    body: JSON.stringify({
                        messages: chatHistory.slice(-10),
                        model: modelName,
                        seed: Math.floor(Math.random() * 100000),
                        jsonMode: false
                    })
                });

                if (!res.ok) {
                    throw new Error(`Free AI server returned status ${res.status}`);
                }

                const rawText = await res.text();
                try {
                    const parsed = JSON.parse(rawText);
                    return parsed?.choices?.[0]?.message?.content || rawText;
                } catch {
                    return rawText;
                }
            } catch (err) {
                if (err?.name === 'AbortError') {
                    throw new Error('Request timed out after 25s');
                }
                throw err;
            } finally {
                clearTimeout(timeoutId);
            }
        }

        async function queryWebLLM(modelId) {
            const webllm = await import('@mlc-ai/web-llm');
            if (!webllmEngine) {
                setStageLoading(true, 'Downloading Local WebGPU AI (First Time Only)...');
                webllmEngine = await webllm.CreateMLCEngine(modelId, {
                    initProgressCallback: (report) => {
                        setStageLoading(true, report.text || 'Loading Local Model...');
                    }
                });
                setStageLoading(false);
            }
            const completion = await webllmEngine.chat.completions.create({
                messages: chatHistory.slice(-8),
                temperature: 0.7,
                max_tokens: 300
            });
            return completion.choices[0]?.message?.content || '✨';
        }

        async function askSuki(prompt) {
            if (isGenerating) return;
            isGenerating = true;
            isAvatarSpeaking = true;

            const sendBtn = document.getElementById('chat-send-btn');
            if (sendBtn) sendBtn.disabled = true;

            chatHistory.push({ role: 'user', content: prompt });
            const typingRow = appendMessage('Suki 🌸', '_Thinking..._ ✨');

            try {
                const selected = localStorage.getItem(STORAGE_KEY_ENGINE) || DEFAULT_ENGINE;
                const [provider, model] = selected.split(':');

                let reply = '';
                if (provider === 'webllm') {
                    reply = await queryWebLLM(model);
                } else {
                    reply = await queryPollinations(model || 'openai');
                }

                reply = (reply || '').trim() || 'Hmm, my signal flickered! Try asking again ✨';
                chatHistory.push({ role: 'assistant', content: reply });
                saveHistory();
                typingRow.remove();
                appendMessage('Suki 🌸', reply);
            } catch (err) {
                typingRow.remove();
                appendMessage('Suki 🌸', `Oops, connection hiccup: ${err.message}`);
            } finally {
                setStageLoading(false);
                isGenerating = false;
                if (sendBtn) sendBtn.disabled = false;
                setTimeout(() => { isAvatarSpeaking = false; }, 1600);
            }
        }

        function bindEvents() {
            const modal = document.getElementById('settings-modal');
            const engineSelect = document.getElementById('ai-engine-select');

            document.getElementById('reset-camera-btn').addEventListener('click', () => {
                if (currentVrm) {
                    const bounds = new THREE.Box3().setFromObject(currentVrm.scene);
                    const size = bounds.getSize(new THREE.Vector3());
                    frameFullBody(size.y || 1.7);
                } else {
                    frameFullBody(1.8);
                }
            });

            document.getElementById('toggle-chat-btn').addEventListener('click', () => {
                isChatCollapsed = !isChatCollapsed;
                const msgBox = document.getElementById('chat-messages');
                const icon = document.getElementById('toggle-chat-icon');
                msgBox.classList.toggle('hidden', isChatCollapsed);
                icon.style.transform = isChatCollapsed ? 'rotate(180deg)' : 'rotate(0deg)';
            });

            document.getElementById('install-ios-btn').addEventListener('click', () => {
                appendMessage('Suki 🌸', 'To install me on iPhone: tap the **Share** button in Safari and choose **Add to Home Screen**! 📱✨');
            });

            document.getElementById('open-settings-btn').addEventListener('click', () => {
                engineSelect.value = localStorage.getItem(STORAGE_KEY_ENGINE) || DEFAULT_ENGINE;
                modal.classList.remove('hidden');
            });

            document.getElementById('close-settings-btn').addEventListener('click', () => {
                modal.classList.add('hidden');
            });

            document.getElementById('save-settings-btn').addEventListener('click', () => {
                localStorage.setItem(STORAGE_KEY_ENGINE, engineSelect.value);
                updateEngineBadge();
                modal.classList.add('hidden');
                appendMessage('Suki 🌸', 'Switched free AI engine! Ready to chat ✨');
            });

            document.getElementById('chat-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const input = document.getElementById('chat-input');
                const text = input.value.trim();
                if (!text || isGenerating) return;
                input.value = '';
                appendMessage('You', text, true);
                await askSuki(text);
            });

            document.getElementById('clear-chat-btn').addEventListener('click', () => {
                chatHistory.length = 1;
                localStorage.removeItem(STORAGE_KEY_HISTORY);
                hydrateChatUI();
                appendMessage('Suki 🌸', 'Memory wiped & chat cleared! Ready whenever you are ✨');
            });

            document.getElementById('vrm-file-input').addEventListener('change', async (e) => {
                const file = e.target.files?.[0];
                e.target.value = '';
                if (!file) return;

                if (!file.name.toLowerCase().endsWith('.vrm')) {
                    appendMessage('Suki 🌸', 'Please select a `.vrm` avatar file.');
                    return;
                }

                const maxBytes = 500 * 1024 * 1024;
                if (file.size === 0 || file.size > maxBytes) {
                    appendMessage('Suki 🌸', file.size === 0
                        ? 'That VRM file is empty.'
                        : 'That VRM is larger than the 500 MB upload limit.');
                    return;
                }

                setStageLoading(true, `Reading ${file.name}...`);
                const url = URL.createObjectURL(file);
                let dracoLoader = null;
                let ktx2Loader = null;

                try {
                    const loader = new GLTFLoader();
                    loader.setMeshoptDecoder(MeshoptDecoder);

                    dracoLoader = new DRACOLoader();
                    dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/libs/draco/');
                    loader.setDRACOLoader(dracoLoader);

                    ktx2Loader = new KTX2Loader();
                    ktx2Loader.setTranscoderPath('https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/libs/basis/');
                    ktx2Loader.detectSupport(renderer);
                    loader.setKTX2Loader(ktx2Loader);

                    loader.register((parser) => new VRMLoaderPlugin(parser));

                    const gltf = await loader.loadAsync(url, (progress) => {
                        if (progress.total > 0) {
                            const percent = Math.round((progress.loaded / progress.total) * 100);
                            setStageLoading(true, `Loading Suki... ${percent}%`);
                        } else {
                            setStageLoading(true, 'Parsing VRM avatar...');
                        }
                    });

                    const loadedVrm = gltf.userData?.vrm;
                    if (!loadedVrm?.scene) {
                        const extensions = gltf.parser?.json?.extensionsUsed || [];
                        throw new Error(
                            `No VRM avatar detected (extensions: ${extensions.join(', ') || 'none'}). Make sure this is an exported VRM file.`
                        );
                    }

                    // VRM 0.x faces -Z by default; VRM 1.0 faces +Z
                    if (loadedVrm.meta?.metaVersion === '0') {
                        VRMUtils.rotateVRM0(loadedVrm);
                    }

                    const avatar = loadedVrm.scene;
                    avatar.updateMatrixWorld(true);
                    const initialBounds = new THREE.Box3().setFromObject(avatar);
                    const initialSize = initialBounds.getSize(new THREE.Vector3());
                    const maxDimension = Math.max(initialSize.x, initialSize.y, initialSize.z);

                    if (!Number.isFinite(maxDimension) || maxDimension <= 0) {
                        throw new Error('The VRM loaded, but its model has no measurable geometry.');
                    }

                    avatar.scale.multiplyScalar(1.7 / maxDimension);
                    avatar.updateMatrixWorld(true);
                    const bounds = new THREE.Box3().setFromObject(avatar);
                    const center = bounds.getCenter(new THREE.Vector3());
                    avatar.position.x -= center.x;
                    avatar.position.y -= bounds.min.y;
                    avatar.position.z -= center.z;
                    avatar.updateMatrixWorld(true);

                    if (currentVrm) {
                        scene.remove(currentVrm.scene);
                        VRMUtils.deepDispose(currentVrm.scene);
                        currentVrm = null;
                    }
                    if (sukiAvatarGroup) {
                        scene.remove(sukiAvatarGroup);
                        sukiAvatarGroup = null;
                        sukiMouth = null;
                        sukiHairBunsGroup = null;
                    }

                    currentVrm = loadedVrm;
                    scene.add(avatar);

                    const finalBounds = new THREE.Box3().setFromObject(avatar);
                    const finalSize = finalBounds.getSize(new THREE.Vector3());
                    frameFullBody(finalSize.y);

                    appendMessage('Suki 🌸', `Successfully loaded **${file.name}**! ✨`);
                } catch (err) {
                    console.error('[SUKI] VRM load failed:', err);
                    appendMessage('Suki 🌸', `Couldn't load **${file.name}**: ${err?.message || 'Unknown loading error'}`);
                } finally {
                    dracoLoader?.dispose();
                    ktx2Loader?.dispose();
                    setStageLoading(false);
                    URL.revokeObjectURL(url);
                }
            });
        }

        updateEngineBadge();
        hydrateChatUI();
        initMatrix();
        initStage();
        bindEvents();
    </script>
</body>
