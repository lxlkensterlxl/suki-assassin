<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SUKI // Tactical HUD Interface</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    /* ==========================================================================
       DYNAMIC THEME VARIABLES DRIVEN BY body[data-suki-mode]
       ========================================================================== */
    :root {
      --hud-primary: #00f0ff;
      --hud-primary-dim: rgba(0, 240, 255, 0.16);
      --hud-primary-glow: rgba(0, 240, 255, 0.45);
      --hud-bg: #050a10;
      --hud-panel: rgba(8, 18, 28, 0.72);
      --hud-grid: rgba(0, 240, 255, 0.06);
      --hud-opacity: 1;
      --ring-speed: 18s;
      --pulse-speed: 4s;
    }

    body[data-suki-mode="idle"] {
      --hud-primary: #00f0ff;
      --hud-primary-dim: rgba(0, 240, 255, 0.14);
      --hud-primary-glow: rgba(0, 240, 255, 0.45);
      --hud-bg: #040911;
      --hud-panel: rgba(6, 16, 26, 0.75);
      --hud-grid: rgba(0, 240, 255, 0.05);
      --hud-opacity: 1;
      --ring-speed: 22s;
      --pulse-speed: 4s;
    }

    body[data-suki-mode="active"] {
      --hud-primary: #00ff88;
      --hud-primary-dim: rgba(0, 255, 136, 0.16);
      --hud-primary-glow: rgba(0, 255, 136, 0.5);
      --hud-bg: #04100b;
      --hud-panel: rgba(6, 24, 16, 0.78);
      --hud-grid: rgba(0, 255, 136, 0.07);
      --hud-opacity: 1;
      --ring-speed: 9s;
      --pulse-speed: 2.2s;
    }

    body[data-suki-mode="stealth"] {
      --hud-primary: #a855f7;
      --hud-primary-dim: rgba(168, 85, 247, 0.12);
      --hud-primary-glow: rgba(168, 85, 247, 0.3);
      --hud-bg: #06040b;
      --hud-panel: rgba(12, 8, 20, 0.65);
      --hud-grid: rgba(168, 85, 247, 0.035);
      --hud-opacity: 0.78;
      --ring-speed: 32s;
      --pulse-speed: 6s;
    }

    body[data-suki-mode="combat"] {
      --hud-primary: #ff2a55;
      --hud-primary-dim: rgba(255, 42, 85, 0.2);
      --hud-primary-glow: rgba(255, 42, 85, 0.65);
      --hud-bg: #120408;
      --hud-panel: rgba(28, 7, 13, 0.82);
      --hud-grid: rgba(255, 42, 85, 0.08);
      --hud-opacity: 1;
      --ring-speed: 4.5s;
      --pulse-speed: 0.9s;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--hud-bg);
      color: var(--hud-primary);
      font-family: 'JetBrains Mono', monospace;
      transition: background-color 0.45s ease, color 0.45s ease;
    }

    .font-display {
      font-family: 'Orbitron', sans-serif;
    }

    /* Background Tactical Grid & Scanlines */
    .hud-grid-bg {
      background-image:
        linear-gradient(to right, var(--hud-grid) 1px, transparent 1px),
        linear-gradient(to bottom, var(--hud-grid) 1px, transparent 1px),
        radial-gradient(circle at 50% 50%, var(--hud-primary-dim) 0%, transparent 68%);
      background-size: 36px 36px, 36px 36px, 100% 100%;
      transition: background-image 0.45s ease;
    }

    .scanlines {
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%,
        rgba(0, 0, 0, 0.35) 50%
      );
      background-size: 100% 4px;
      pointer-events: none;
    }

    /* Telemetry Panel Styling with Corner Brackets */
    .hud-panel {
      background: var(--hud-panel);
      border: 1px solid var(--hud-primary-dim);
      backdrop-filter: blur(8px);
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5), inset 0 0 12px var(--hud-primary-dim);
      opacity: var(--hud-opacity);
      transition: all 0.4s ease;
      position: relative;
    }

    .hud-panel::before,
    .hud-panel::after {
      content: '';
      position: absolute;
      width: 10px;
      height: 10px;
      border-color: var(--hud-primary);
      border-style: solid;
      transition: border-color 0.4s ease;
      pointer-events: none;
    }

    .hud-panel::before {
      top: -1px;
      left: -1px;
      border-width: 2px 0 0 2px;
    }

    .hud-panel::after {
      bottom: -1px;
      right: -1px;
      border-width: 0 2px 2px 0;
    }

    /* Holographic Reticle Animations */
    @keyframes spin-cw {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes spin-ccw {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    @keyframes core-breathe {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 12px var(--hud-primary-glow)); }
      50% { transform: scale(1.04); filter: drop-shadow(0 0 24px var(--hud-primary-glow)); }
    }

    @keyframes combat-shake {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-1.5px, 1px); }
      50% { transform: translate(1.5px, -1px); }
      75% { transform: translate(-1px, -1.5px); }
    }

    .ring-outer {
      animation: spin-cw var(--ring-speed) linear infinite;
      transform-origin: center;
    }

    .ring-inner {
      animation: spin-ccw calc(var(--ring-speed) * 0.65) linear infinite;
      transform-origin: center;
    }

    .avatar-core-pulse {
      animation: core-breathe var(--pulse-speed) ease-in-out infinite;
      transform-origin: center;
    }

    body[data-suki-mode="combat"] .combat-alert-jitter {
      animation: combat-shake 0.25s infinite;
    }

    body[data-suki-mode="combat"] .combat-reticle-lock {
      transform: scale(0.92);
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .combat-reticle-lock {
      transform: scale(1);
      transition: transform 0.4s ease;
    }

    /* Mode Selector Buttons */
    .mode-btn {
      border: 1px solid var(--hud-primary-dim);
      background: rgba(0, 0, 0, 0.35);
      color: var(--hud-primary);
      transition: all 0.25s ease;
    }

    .mode-btn:hover {
      background: var(--hud-primary-dim);
      box-shadow: 0 0 12px var(--hud-primary-glow);
    }

    .mode-btn.active-mode {
      background: var(--hud-primary);
      color: #03060a;
      font-weight: 700;
      box-shadow: 0 0 16px var(--hud-primary-glow);
    }

    /* Tap Ripple Feedback */
    @keyframes tap-ring {
      0% { transform: scale(0.7); opacity: 0.9; }
      100% { transform: scale(1.45); opacity: 0; }
    }
    .tap-burst {
      animation: tap-ring 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body data-suki-mode="idle" class="hud-grid-bg relative flex flex-col justify-between p-3 sm:p-5">

  <!-- CRT Scanline & Outer Frame Overlay -->
  <div class="scanlines fixed inset-0 z-40"></div>
  <div class="pointer-events-none fixed inset-2 sm:inset-3 border border-[var(--hud-primary-dim)] rounded-lg z-30 transition-colors duration-500"></div>

  <!-- ========================================================================
       TOP TELEMETRY BAR (LEFT & RIGHT CLUSTERS)
       ======================================================================== -->
  <header class="relative z-20 flex flex-col sm:flex-row justify-between items-stretch sm:items-start gap-3">

    <!-- TOP-LEFT TELEMETRY CLUSTER: STATUS, ASSET, MODE -->
    <div class="hud-panel rounded-md px-3.5 py-2.5 sm:px-4 sm:py-3 flex flex-wrap sm:flex-nowrap items-center gap-4 sm:gap-5">
      <!-- Status -->
      <div class="flex flex-col">
        <span class="text-[10px] tracking-[0.2em] opacity-60 uppercase">SYS.STATUS</span>
        <div class="flex items-center gap-2 mt-0.5">
          <span class="w-2 h-2 rounded-full bg-[var(--hud-primary)] animate-ping"></span>
          <span id="hud-status" class="text-xs sm:text-sm font-bold tracking-wider">BOOTING</span>
        </div>
      </div>

      <div class="h-7 w-px bg-[var(--hud-primary-dim)] hidden sm:block"></div>

      <!-- Asset State -->
      <div class="flex flex-col">
        <span class="text-[10px] tracking-[0.2em] opacity-60 uppercase">ASSET.CORE</span>
        <span id="hud-asset" class="text-xs sm:text-sm font-bold tracking-wider mt-0.5">STANDBY</span>
      </div>

      <div class="h-7 w-px bg-[var(--hud-primary-dim)] hidden sm:block"></div>

      <!-- Mode Badge -->
      <div class="flex flex-col ml-auto sm:ml-0">
        <span class="text-[10px] tracking-[0.2em] opacity-60 uppercase">OP.MODE</span>
        <div class="mt-0.5 px-2.5 py-0.5 rounded bg-[var(--hud-primary-dim)] border border-[var(--hud-primary)] text-center combat-alert-jitter">
          <span id="hud-mode" class="font-display text-xs sm:text-sm font-bold tracking-[0.18em]">IDLE</span>
        </div>
      </div>
    </div>

    <!-- TOP-RIGHT TELEMETRY CLUSTER: GPU, FPS, NEURAL SYNC -->
    <div class="hud-panel rounded-md px-3.5 py-2.5 sm:px-4 sm:py-3 flex flex-wrap sm:flex-nowrap items-center justify-between sm:justify-end gap-4 sm:gap-5">
      <!-- GPU Hardware Readout -->
      <div class="flex flex-col">
        <span class="text-[10px] tracking-[0.2em] opacity-60 uppercase">RENDER.GPU</span>
        <span id="hud-gpu" class="text-xs sm:text-sm font-semibold tracking-wider mt-0.5">PROBING...</span>
      </div>

      <div class="h-7 w-px bg-[var(--hud-primary-dim)] hidden sm:block"></div>

      <!-- Live FPS Counter -->
      <div class="flex flex-col min-w-[54px]">
        <span class="text-[10px] tracking-[0.2em] opacity-60 uppercase">FRAME.FPS</span>
        <div class="flex items-baseline gap-1 mt-0.5">
          <span id="hud-fps" class="text-xs sm:text-sm font-bold tabular-nums">60</span>
          <span class="text-[10px] opacity-60">HZ</span>
        </div>

      <div class="h-7 w-px bg-[var(--hud-primary-dim)] hidden sm:block"></div>

      <!-- Neural Sync + Progress Bar -->

            style="width: 45%; box-shadow: 0 0 8px var(--hud-primary-glow);"
          ></div>
        </div>
      </div>
    </div>

  </header>

       CENTER INTERACTIVE STAGE & HOLOGRAPHIC AVATAR ("SUKI")
       ======================================================================== -->
  <main
    id="hud-stage"
    class="relative z-10 flex-1 flex flex-col items-center justify-center cursor-pointer overflow-hidden my-2"

    <div class="hidden md:flex flex-col justify-between h-64 absolute left-6 opacity-40 text-[10px] tracking-widest pointer-events-none">

    <div class="hidden md:flex flex-col justify-between items-end h-64 absolute right-6 opacity-40 text-[10px] tracking-widest pointer-events-none">
      <span>SYNC // BUS_01</span>
      <span>CORE // SUKI_V4</span>
      <span class="text-[var(--hud-primary)] font-bold">LINK // ACTIVE</span>

    <!-- Interactive Holographic Avatar Core -->
    <div
      id="hud-avatar"

      <div id="tap-burst-layer" class="absolute inset-0 pointer-events-none flex items-center justify-center"></div>

      <svg viewBox="0 0 400 400" class="w-full h-full overflow-visible">
        <defs>
          <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">

        </defs>

        <!-- Ambient Core Aura -->
        <circle cx="200" cy="200" r="165" fill="url(#coreGlow)" class="avatar-core-pulse" />

        <!-- Outer Rotating Segmented Telemetry Ring -->
        <g class="ring-outer" stroke="currentColor" fill="none">

          <line x1="378" y1="200" x2="392" y2="200" stroke-width="2" />
        </g>

        <!-- Counter-Rotating Inner Tactical Ring -->
        <g class="ring-inner" stroke="currentColor" fill="none">

          <path d="M 85 290 L 85 315 L 110 315" />

        <g class="avatar-core-pulse" stroke="currentColor" fill="none">

  <!-- ========================================================================
       BOTTOM INTERACTION HINT & QUICK-SELECT CONTROLS
       ======================================================================== -->
  <footer class="relative z-20 flex flex-col items-center gap-2.5">
    <!-- Subtle Prompt Hint -->
    <div class="text-[10px] sm:text-xs tracking-[0.24em] uppercase opacity-75 text-center animate-pulse">
      [ TAP AVATAR OR STAGE TO CYCLE MODE ]
    </div>

    <!-- Control Bar: Quick-Select Modes + Asset Reload Simulation -->
    <div class="hud-panel rounded-md px-3 py-2 flex flex-wrap items-center justify-center gap-2 w-full max-w-2xl">
      <div class="flex items-center gap-1.5 flex-wrap justify-center" id="mode-buttons">
        <button type="button" data-mode-index="0" class="mode-btn px-2.5 py-1.5 rounded text-[11px] tracking-wider uppercase cursor-pointer">
          IDLE
        </button>
        <button type="button" data-mode-index="1" class="mode-btn px-2.5 py-1.5 rounded text-[11px] tracking-wider uppercase cursor-pointer">
          ACTIVE
        </button>
        <button type="button" data-mode-index="2" class="mode-btn px-2.5 py-1.5 rounded text-[11px] tracking-wider uppercase cursor-pointer">
          STEALTH
        </button>
        <button type="button" data-mode-index="3" class="mode-btn px-2.5 py-1.5 rounded text-[11px] tracking-wider uppercase cursor-pointer">
          COMBAT
        </button>
      </div>

      <div class="h-5 w-px bg-[var(--hud-primary-dim)] hidden sm:block mx-1"></div>

      <!-- Simulate Asset Reload Button -->
      <button
        type="button"
        id="reload-asset-btn"
        class="mode-btn px-3 py-1.5 rounded text-[11px] tracking-wider uppercase cursor-pointer flex items-center gap-1.5"
      >
        <span>↻</span>
        <span>Simulate Asset Reload</span>
      </button>
    </div>
  </footer>

  <script>
    /* ==========================================================================
       1. EXACT USER-PROVIDED HUD_MODES & SukiHudController CLASS
       ========================================================================== */
    const HUD_MODES = ['IDLE', 'ACTIVE', 'STEALTH', 'COMBAT'];

    class SukiHudController {
      constructor(elements = {}) {
        this.el = elements;
        this.modeIndex = 0;
        this.frames = 0;
        this.lastFpsTime = performance.now();
        this.currentFps = 60;
        this.assetReady = false;
        this.rafId = null;
      }

      async init({ loadAsset, avatarTarget } = {}) {
        this.setMode(this.modeIndex);
        this.setStatus('READY');
        this.checkGpu();
        this.bindAvatarTap(avatarTarget);
        this.startLoop();

        if (typeof loadAsset === 'function') {
          this.setAssetState('LOADING');
          try {
            await loadAsset();
            this.assetReady = true;
            this.setAssetState('ONLINE');
          } catch (err) {
            console.error('HUD asset load failed:', err);
            this.setAssetState('FALLBACK');
          }
        }
      }

      setStatus(text) {
        if (this.el.status) this.el.status.textContent = text;
      }

      setAssetState(state) {
        if (this.el.asset) this.el.asset.textContent = state;
      }

      setMode(index) {
        this.modeIndex = ((index % HUD_MODES.length) + HUD_MODES.length) % HUD_MODES.length;
        const mode = HUD_MODES[this.modeIndex];
        if (this.el.mode) this.el.mode.textContent = mode;
        document.body.dataset.sukiMode = mode.toLowerCase();
      }

      cycleMode() {
        this.setMode(this.modeIndex + 1);
      }

      bindAvatarTap(target) {
        const node = target || this.el.avatar || this.el.stage;
        if (!node) return;
        node.addEventListener('pointerup', () => this.cycleMode(), { passive: true });
      }

      async checkGpu() {
        if (!this.el.gpu) return;
        try {
          if (navigator.gpu) {
            const adapter = await navigator.gpu.requestAdapter();
            this.el.gpu.textContent = adapter ? 'WEBGPU READY' : 'UNAVAILABLE';
          } else {
            const glCanvas = document.createElement('canvas');
            const gl = glCanvas.getContext('webgl2') || glCanvas.getContext('webgl');
            this.el.gpu.textContent = gl ? 'WEBGL (NO WEBGPU)' : 'CPU / NONE';
          }
        } catch {
          this.el.gpu.textContent = 'FALLBACK';
        }
      }

      updateNeuralSync() {
        if (!this.el.neuralSync) return;
        // Example: tie sync percentage to asset + engine readiness instead of a static 100%
        const sync = this.assetReady ? 100 : 45;
        this.el.neuralSync.textContent = `${sync}%`;
      }

      startLoop() {
        const tick = (now) => {
          this.frames += 1;
          const elapsed = now - this.lastFpsTime;
          if (elapsed >= 500) {
            this.currentFps = Math.round((this.frames * 1000) / elapsed);
            if (this.el.fps) this.el.fps.textContent = String(this.currentFps);
            this.updateNeuralSync();
            this.frames = 0;
            this.lastFpsTime = now;
          }
          this.rafId = requestAnimationFrame(tick);
        };
        this.rafId = requestAnimationFrame(tick);
      }

      destroy() {
        if (this.rafId) cancelAnimationFrame(this.rafId);
      }
    }

    /* ==========================================================================
       2. UI WIRING, REACTIVE PARTICLE/WAVEFORM CANVAS & INTERACTIVE CONTROLS
       ========================================================================== */
    document.addEventListener('DOMContentLoaded', () => {
      const elements = {
        status: document.getElementById('hud-status'),
        asset: document.getElementById('hud-asset'),
        mode: document.getElementById('hud-mode'),
        gpu: document.getElementById('hud-gpu'),
        fps: document.getElementById('hud-fps'),
        neuralSync: document.getElementById('hud-neural-sync'),
        avatar: document.getElementById('hud-avatar'),
        stage: document.getElementById('hud-stage')
      };

      const neuralSyncBar = document.getElementById('neural-sync-bar');
      const modeButtons = document.querySelectorAll('#mode-buttons .mode-btn');
      const reloadAssetBtn = document.getElementById('reload-asset-btn');
      const tapBurstLayer = document.getElementById('tap-burst-layer');

      // Instantiate SukiHudController
      const hud = new SukiHudController(elements);

      // Keep UI progress bar & active mode buttons synchronized with controller state
      const syncUiVisuals = () => {
        // Sync Neural Sync progress bar width
        const pct = hud.assetReady ? 100 : 45;
        if (neuralSyncBar) {
          neuralSyncBar.style.width = `${pct}%`;
        }
        // Highlight active mode button
        modeButtons.forEach((btn) => {
          const btnIdx = Number(btn.dataset.modeIndex);
          btn.classList.toggle('active-mode', btnIdx === hud.modeIndex);
        });
      };

      // Observe text changes on neuralSync & mode to keep auxiliary UI elements in sync
      const observer = new MutationObserver(syncUiVisuals);
      observer.observe(elements.neuralSync, { childList: true, characterData: true, subtree: true });
      observer.observe(elements.mode, { childList: true, characterData: true, subtree: true });

      // Simulated async asset loader (resolves after 1.6s)
      const simulateLoadAsset = () => new Promise((resolve) => {
        setTimeout(() => resolve(true), 1600);
      });

      // Initialize HUD controller (binds avatar tap automatically)
      hud.init({
        loadAsset: simulateLoadAsset,
        avatarTarget: elements.avatar
      }).then(syncUiVisuals);

      // Also allow tapping anywhere on the stage outside the avatar to cycle modes
      elements.stage.addEventListener('pointerup', (e) => {
        if (!elements.avatar.contains(e.target)) {
          hud.cycleMode();
        }
        triggerTapBurst();
        syncUiVisuals();
      }, { passive: true });

      // Quick-select mode buttons
      modeButtons.forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = Number(btn.dataset.modeIndex);
          hud.setMode(idx);
          triggerTapBurst();
          syncUiVisuals();
        });
      });

      // Simulate Asset Reload button: resets assetReady -> false (45%) -> LOADING -> ONLINE (100%)
      let isReloading = false;
      reloadAssetBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (isReloading) return;
        isReloading = true;
        reloadAssetBtn.style.opacity = '0.5';

        hud.assetReady = false;
        hud.updateNeuralSync();
        syncUiVisuals();
        hud.setAssetState('LOADING');
        hud.setStatus('SYNCING');

        try {
          await simulateLoadAsset();
          hud.assetReady = true;
          hud.setAssetState('ONLINE');
          hud.setStatus('READY');
          hud.updateNeuralSync();
          syncUiVisuals();
        } catch {
          hud.setAssetState('FALLBACK');
          hud.setStatus('DEGRADED');
        } finally {
          isReloading = false;
          reloadAssetBtn.style.opacity = '1';
        }
      });

      // Visual pulse ring on mode cycle
      function triggerTapBurst() {
        const ring = document.createElement('div');
        ring.className = 'tap-burst absolute w-56 h-56 sm:w-72 sm:h-72 rounded-full border-2 border-[var(--hud-primary)] pointer-events-none';
        tapBurstLayer.appendChild(ring);
        ring.addEventListener('animationend', () => ring.remove());
      }

      /* ========================================================================
         3. REACTIVE PARTICLE & AUDIO-STYLE WAVEFORM CANVAS
         ======================================================================== */
      const canvas = document.getElementById('stage-canvas');
      const ctx = canvas.getContext('2d');
      let width = 0;
      let height = 0;

      const particles = Array.from({ length: 42 }, () => ({
        x: Math.random(),
        y: Math.random(),
        vx: (Math.random() - 0.5) * 0.0012,
        vy: (Math.random() - 0.5) * 0.0012,
        size: Math.random() * 2 + 1
      }));

      function resizeCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = rect.width;
        height = rect.height;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      const modeConfigs = {
        idle: { color: '#00f0ff', speedMult: 0.7, waveAmp: 12, waveFreq: 0.015 },
        active: { color: '#00ff88', speedMult: 1.8, waveAmp: 24, waveFreq: 0.025 },
        stealth: { color: '#a855f7', speedMult: 0.35, waveAmp: 6, waveFreq: 0.01 },
        combat: { color: '#ff2a55', speedMult: 3.4, waveAmp: 38, waveFreq: 0.045 }
      };

      let phase = 0;
      function renderCanvas() {
        const modeKey = document.body.dataset.sukiMode || 'idle';
        const cfg = modeConfigs[modeKey] || modeConfigs.idle;

        ctx.clearRect(0, 0, width, height);

        // Draw subtle horizontal telemetry waveform behind avatar
        phase += 0.04 * cfg.speedMult;
        ctx.save();
        ctx.strokeStyle = cfg.color;
        ctx.lineWidth = 1.25;
        ctx.globalAlpha = modeKey === 'stealth' ? 0.14 : 0.25;
        ctx.beginPath();
        const midY = height * 0.5;
        for (let x = 0; x <= width; x += 6) {
          const distFromCenter = Math.abs(x - width * 0.5) / (width * 0.5);
          const envelope = Math.max(0, 1 - distFromCenter * 1.15);
          const y =
            midY +
            Math.sin(x * cfg.waveFreq + phase) * cfg.waveAmp * envelope +
            Math.cos(x * cfg.waveFreq * 2.1 - phase * 1.4) * (cfg.waveAmp * 0.4) * envelope;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.restore();

        // Update and draw reactive floating telemetry particles
        ctx.save();
        ctx.fillStyle = cfg.color;
        particles.forEach((p) => {
          p.x += p.vx * cfg.speedMult;
          p.y += p.vy * cfg.speedMult;

          if (p.x < 0) p.x = 1;
          if (p.x > 1) p.x = 0;
          if (p.y < 0) p.y = 1;
          if (p.y > 1) p.y = 0;

          const px = p.x * width;
          const py = p.y * height;

          ctx.globalAlpha = modeKey === 'stealth' ? 0.2 : 0.45;
          ctx.fillRect(px, py, p.size, p.size);
        });
        ctx.restore();

        requestAnimationFrame(renderCanvas);
      }

      requestAnimationFrame(renderCanvas);
    });
  </script>
</body>
</html>
