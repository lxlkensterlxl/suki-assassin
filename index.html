<!DOCTYPE html>
<html lang="en">

    {

        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(15, 10, 26, 0.85); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }

                <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>

                <label for="vrm-file-input" class="cursor-pointer hover:bg-pink-600/20 text-pink-200 text-xs px-3 py-1.5 rounded-xl transition flex items-center space-x-1.5">

                    <span>Load .VRM</span>

                <input id="vrm-file-input" type="file" accept=".vrm" class="hidden">

        <!-- Chat Sub-Window -->
        <div id="chat-subwindow" class="absolute bottom-4 right-4 w-72 sm:w-80 h-[340px] bg-[#0d071b]/95 backdrop-blur-xl border border-pink-500/40 rounded-2xl shadow-2xl flex flex-col z-40 overflow-hidden">
            <div class="px-3 py-2 bg-[#170c2e]/95 border-b border-pink-500/20 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <div class="w-5 h-5 rounded-full ninja-gradient flex items-center justify-center font-black text-[9px] text-white">🌸</div>
                    <span class="font-bold text-xs text-pink-100 tracking-wide">SUKI CHAT</span>
                </div>
                <button id="clear-chat-btn" type="button" class="p-1 text-pink-300/70 hover:text-pink-300 transition" title="Clear Chat">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
            </div>
            <div id="chat-messages" class="flex-1 overflow-y-auto p-3 space-y-2.5 text-xs">

                        <span class="text-pink-400 font-bold uppercase tracking-wider block text-[10px] mb-0.5">Suki 🌸</span>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-[#140b24] border border-pink-500/30 w-full max-w-md rounded-2xl p-6 space-y-4 shadow-2xl">
            <h3 class="text-base font-bold text-white flex items-center justify-between">
                <span>Settings</span>
                <button id="close-settings-btn" type="button" class="text-pink-300 hover:text-white text-lg">×</button>
            </h3>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-pink-200 mb-1 font-medium">Gemini LLM Model</label>
                    <select id="gemini-model-select" class="w-full bg-[#1e1136] border border-pink-500/30 rounded-lg p-2.5 text-white">
                        <option value="gemini-2.5-flash" selected>gemini-2.5-flash</option>
                        <option value="gemini-2.5-pro">gemini-2.5-pro</option>
                    </select>
                </div>
                <div>
                    <label class="block text-pink-200 mb-1 font-medium">Gemini API Key</label>
                    <input id="gemini-key-input" type="password" placeholder="AIzaSy..." class="w-full bg-[#1e1136] border border-pink-500/30 rounded-lg p-2.5 text-white">
                </div>
            </div>
            <button id="save-settings-btn" type="button" class="w-full py-2.5 ninja-gradient rounded-xl font-bold text-xs text-white shadow-lg">Save & Apply</button>
        </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

        let scene, camera, renderer, clock, controls, currentVrm;
        let sukiAvatarGroup, sukiMouth, sukiHairBunsGroup;
        let isAvatarSpeaking = false;
        let matrixCanvas, matrixCtx, matrixColumns, matrixDrops;
        const matrixChars = "SUKI0123456789🌸✨💖⭐💫";
        const DEFAULT_GEMINI_MODEL = 'gemini-2.5-flash';
        const STORAGE_KEYS = {
            apiKey: 'suki_gemini_api_key',
            model: 'suki_gemini_model'
        };

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function setStageLoading(visible, message = 'Summoning Cute Anime Suki...') {
            const overlay = document.getElementById('stage-loading');
            const label = document.getElementById('stage-loading-text');
            if (label) label.textContent = message;
            if (overlay) overlay.classList.toggle('hidden', !visible);
        }

        function initMatrix() {
            matrixCanvas = document.getElementById('matrix-canvas');
            matrixCtx = matrixCanvas.getContext('2d');
            resizeMatrix();
            window.addEventListener('resize', resizeMatrix);
            setInterval(drawMatrix, 45);
        }

        function resizeMatrix() {
            matrixCanvas.width = window.innerWidth;
            matrixCanvas.height = window.innerHeight;
            const fontSize = 14;
            matrixColumns = Math.floor(matrixCanvas.width / fontSize);
            matrixDrops = Array.from({ length: matrixColumns }, () => Math.random() * 40);
        }

        function drawMatrix() {
            matrixCtx.fillStyle = 'rgba(5, 3, 8, 0.08)';
            matrixCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
            matrixCtx.fillStyle = '#ec4899';
            matrixCtx.font = '14px monospace';
            for (let i = 0; i < matrixDrops.length; i++) {
                const text = matrixChars[Math.floor(Math.random() * matrixChars.length)];
                matrixCtx.fillText(text, i * 14, matrixDrops[i] * 14);
                if (matrixDrops[i] * 14 > matrixCanvas.height && Math.random() > 0.975) {
                    matrixDrops[i] = 0;
                }
                matrixDrops[i]++;
            }
        }

        function createFallbackSuki() {
            sukiAvatarGroup = new THREE.Group();
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffe4dc, roughness: 0.6 });
            const hairMat = new THREE.MeshStandardMaterial({ color: 0xf472b6, roughness: 0.4 });
            const outfitMat = new THREE.MeshStandardMaterial({ color: 0x1e1136, roughness: 0.5 });

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.45, 24, 24), skinMat);
            head.position.y = 1.45;
            sukiAvatarGroup.add(head);

            sukiHairBunsGroup = new THREE.Group();
            const leftBun = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 16), hairMat);
            leftBun.position.set(-0.46, 1.72, -0.05);
            const rightBun = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 16), hairMat);
            rightBun.position.set(0.46, 1.72, -0.05);
            sukiHairBunsGroup.add(leftBun, rightBun);
            sukiAvatarGroup.add(sukiHairBunsGroup);

            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x06b6d4 });
            const leftEye = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 12), eyeMat);
            leftEye.position.set(-0.15, 1.47, 0.41);
            const rightEye = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 12), eyeMat);
            rightEye.position.set(0.15, 1.47, 0.41);
            sukiAvatarGroup.add(leftEye, rightEye);

            sukiMouth = new THREE.Mesh(
                new THREE.BoxGeometry(0.12, 0.04, 0.04),
                new THREE.MeshBasicMaterial({ color: 0xf43f5e })
            );
            sukiMouth.position.set(0, 1.31, 0.43);
            sukiAvatarGroup.add(sukiMouth);

            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.34, 0.85, 20), outfitMat);
            body.position.y = 0.65;
            sukiAvatarGroup.add(body);

            scene.add(sukiAvatarGroup);
            setStageLoading(false);
        }

        function initStage() {
            const container = document.getElementById('vrm-canvas-holder');
            scene = new THREE.Scene();
            clock = new THREE.Clock();

            const width = Math.max(container.clientWidth, 1);
            const height = Math.max(container.clientHeight, 1);
            camera = new THREE.PerspectiveCamera(35, width / height, 0.1, 100);
            camera.position.set(0, 1.35, 2.6);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 1.25, 0);
            controls.enableDamping = true;

            const ambient = new THREE.AmbientLight(0xffffff, 0.8);
            const keyLight = new THREE.DirectionalLight(0xff9ad5, 1.2);
            keyLight.position.set(2, 4, 3);
            scene.add(ambient, keyLight);

            createFallbackSuki();

            window.addEventListener('resize', () => {
                const w = Math.max(container.clientWidth, 1);
                const h = Math.max(container.clientHeight, 1);
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
                renderer.setSize(w, h);
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const elapsed = clock.elapsedTime;

            if (currentVrm) {
                currentVrm.update(delta);
            } else if (sukiAvatarGroup) {
                sukiAvatarGroup.position.y = Math.sin(elapsed * 2.2) * 0.03;
                if (sukiHairBunsGroup) {
                    sukiHairBunsGroup.rotation.z = Math.sin(elapsed * 3) * 0.05;
                }
                if (sukiMouth) {
                    const talkScale = isAvatarSpeaking ? 1 + Math.abs(Math.sin(elapsed * 16)) * 2.5 : 1;
                    sukiMouth.scale.y = talkScale;
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        function appendMessage(sender, text, isUser = false) {
            const chatBox = document.getElementById('chat-messages');
            const row = document.createElement('div');
            row.className = `flex space-x-2 ${isUser ? 'justify-end' : ''}`;

            const rendered = window.marked ? window.marked.parse(text) : escapeHtml(text);
            row.innerHTML = isUser
                ? `<div class="bg-pink-600/30 border border-pink-500/40 p-2.5 rounded-xl text-white leading-snug max-w-[85%]">${rendered}</div>`
                : `<div class="w-6 h-6 rounded-full bg-pink-600 shrink-0 flex items-center justify-center font-black text-xs text-white">🌸</div>
                   <div class="bg-[#1e1136]/90 border border-pink-500/30 p-2.5 rounded-xl text-pink-100 leading-snug shadow-md prose-suki max-w-[85%]">
                       <span class="text-pink-400 font-bold uppercase tracking-wider block text-[10px] mb-0.5">${escapeHtml(sender)}</span>
                       ${rendered}
                   </div>`;

            chatBox.appendChild(row);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function askSuki(prompt) {
            const apiKey = localStorage.getItem(STORAGE_KEYS.apiKey) || '';
            const model = localStorage.getItem(STORAGE_KEYS.model) || DEFAULT_GEMINI_MODEL;

            isAvatarSpeaking = true;
            try {
                if (!apiKey) {
                    appendMessage('Suki 🌸', `I heard **"${escapeHtml(prompt)}"**! Add your Gemini API key in **Settings** so I can give full AI replies.`);
                    return;
                }

                const res = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `You are Suki, a cheerful cute anime companion. Keep replies concise and helpful. User: ${prompt}` }] }]
                        })
                    }
                );
                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data?.error?.message || `Request failed with status ${res.status}`);
                }
                const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text || 'Hmm, I lost my train of thought! ✨';
                appendMessage('Suki 🌸', reply);
            } catch (err) {
                appendMessage('Suki 🌸', `Oops, something went wrong: ${escapeHtml(err.message)}`);
            } finally {
                isAvatarSpeaking = false;
            }
        }

        function bindEvents() {
            const modal = document.getElementById('settings-modal');
            const keyInput = document.getElementById('gemini-key-input');
            const modelSelect = document.getElementById('gemini-model-select');

            document.getElementById('open-settings-btn').addEventListener('click', () => {
                keyInput.value = localStorage.getItem(STORAGE_KEYS.apiKey) || '';
                modelSelect.value = localStorage.getItem(STORAGE_KEYS.model) || DEFAULT_GEMINI_MODEL;
                modal.classList.remove('hidden');
            });

            document.getElementById('close-settings-btn').addEventListener('click', () => {
                modal.classList.add('hidden');
            });

            document.getElementById('save-settings-btn').addEventListener('click', () => {
                localStorage.setItem(STORAGE_KEYS.apiKey, keyInput.value.trim());
                localStorage.setItem(STORAGE_KEYS.model, modelSelect.value);
                modal.classList.add('hidden');
            });

            document.getElementById('chat-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const input = document.getElementById('chat-input');
                const text = input.value.trim();
                if (!text) return;
                input.value = '';
                appendMessage('You', text, true);
                await askSuki(text);
            });

            document.getElementById('clear-chat-btn').addEventListener('click', () => {
                document.getElementById('chat-messages').innerHTML = '';
                appendMessage('Suki 🌸', 'Chat cleared! Ready whenever you are ✨');
            });

            document.getElementById('vrm-file-input').addEventListener('change', async (e) => {
                const file = e.target.files?.[0];
                e.target.value = '';
                if (!file) return;

                if (!file.name.toLowerCase().endsWith('.vrm')) {
                    appendMessage('Suki 🌸', 'Please select a .vrm avatar file.');
                    return;
                }

                const maxBytes = 500 * 1024 * 1024;
                if (file.size === 0 || file.size > maxBytes) {
                    appendMessage('Suki 🌸', file.size === 0
                        ? 'That VRM file is empty.'
                        : 'That VRM is larger than the 500 MB upload limit.');
                    return;
                }

                setStageLoading(true, `Reading ${file.name}...`);
                const url = URL.createObjectURL(file);
                let loadedVrm = null;

                try {
                    const loader = new GLTFLoader();
                    loader.register((parser) => new VRMLoaderPlugin(parser));

                    console.info('[SUKI] Loading VRM:', {
                        name: file.name,
                        size: file.size,
                        type: file.type
                    });

                    const gltf = await loader.loadAsync(url, (progress) => {
                        if (progress.total > 0) {
                            const percent = Math.round((progress.loaded / progress.total) * 100);
                            setStageLoading(true, `Loading Suki... ${percent}%`);
                        } else {
                            setStageLoading(true, 'Parsing VRM 1.0 avatar...');
                        }
                    });

                    loadedVrm = gltf.userData?.vrm;
                    if (!loadedVrm?.scene) {
                        const extensions = gltf.parser?.json?.extensionsUsed || [];
                        console.error('[SUKI] GLTF loaded, but VRM plugin did not create gltf.userData.vrm.', {
                            extensionsUsed: extensions,
                            userData: gltf.userData
                        });
                        throw new Error(
                            `The file opened as glTF, but no VRM avatar was detected. VRM extensions found: ${extensions.join(', ') || 'none'}. Make sure this is an exported VRM 1.0 file, not a .glb renamed to .vrm.`
                        );
                    }

                    // Do not remove the existing avatar until the new one has parsed and validated.
                    const avatar = loadedVrm.scene;
                    avatar.updateMatrixWorld(true);
                    const initialBounds = new THREE.Box3().setFromObject(avatar);
                    const initialSize = initialBounds.getSize(new THREE.Vector3());
                    const maxDimension = Math.max(initialSize.x, initialSize.y, initialSize.z);

                    if (!Number.isFinite(maxDimension) || maxDimension <= 0) {
                        throw new Error('The VRM loaded, but its model has no measurable geometry.');
                    }

                    // Normalize to roughly 1.7 world units and put the feet on y=0.
                    avatar.scale.multiplyScalar(1.7 / maxDimension);
                    avatar.updateMatrixWorld(true);
                    const bounds = new THREE.Box3().setFromObject(avatar);
                    const center = bounds.getCenter(new THREE.Vector3());
                    avatar.position.x -= center.x;
                    avatar.position.y -= bounds.min.y;
                    avatar.position.z -= center.z;
                    avatar.updateMatrixWorld(true);

                    // VRM 1.0 faces +Z, which is toward this camera setup.
                    if (currentVrm) {
                        scene.remove(currentVrm.scene);
                        VRMUtils.deepDispose(currentVrm.scene);
                        currentVrm = null;
                    }
                    if (sukiAvatarGroup) {
                        scene.remove(sukiAvatarGroup);
                        sukiAvatarGroup = null;
                        sukiMouth = null;
                        sukiHairBunsGroup = null;
                    }

                    currentVrm = loadedVrm;
                    scene.add(avatar);

                    // Frame the full model based on its normalized height.
                    const finalBounds = new THREE.Box3().setFromObject(avatar);
                    const finalSize = finalBounds.getSize(new THREE.Vector3());
                    const targetY = Math.max(finalSize.y * 0.52, 0.5);
                    controls.target.set(0, targetY, 0);
                    camera.position.set(0, targetY + 0.45, Math.max(2.8, finalSize.y * 2.0));
                    camera.lookAt(0, targetY, 0);
                    controls.update();

                    console.info('[SUKI] VRM loaded successfully:', loadedVrm);
                    appendMessage('Suki 🌸', `Successfully loaded **${escapeHtml(file.name)}**! ✨`);
                } catch (err) {
                    console.error('[SUKI] VRM load failed:', err);
                    const detail = err?.message || String(err) || 'Unknown loading error';
                    appendMessage('Suki 🌸', `Couldn't load **${escapeHtml(file.name)}**: ${escapeHtml(detail)}`);
                } finally {
                    setStageLoading(false);
                    URL.revokeObjectURL(url);
                }
            });
        }

        initMatrix();
        initStage();
        bindEvents();
    </script>
</body>
</html>
