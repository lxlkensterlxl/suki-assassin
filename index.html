<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SUKI - Cute Anime Girl 3D Studio</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SUKI AI">
    <link rel="apple-touch-icon" href="https://placehold.co/192x192/0c0717/ec4899?text=🌸+SUKI">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@0.6.4/lib/three-vrm.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(15, 10, 26, 0.85); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
        .ninja-gradient { background: linear-gradient(135deg, #ec4899 0%, #a855f7 50%, #06b6d4 100%); }
        .ninja-glow { box-shadow: 0 0 25px rgba(236, 72, 153, 0.45); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0b0714; }
        ::-webkit-scrollbar-thumb { background: #26173a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #ec4899; }
    </style>
</head>
<body class="bg-[#07040d] text-gray-100 flex h-[100dvh] overflow-hidden">
    <!-- Sidebar -->
    <aside id="sidebar" class="w-14 bg-[#0c0717]/95 backdrop-blur-md border-r border-[#26153d] flex flex-col justify-between items-center py-3 shrink-0 z-30">
        <div class="flex flex-col items-center space-y-4 w-full">
            <div class="w-9 h-9 rounded-full ninja-gradient p-0.5 flex items-center justify-center ninja-glow cursor-pointer" title="SUKI - Anime AI">
                <div class="w-full h-full bg-[#0c0717] rounded-full flex items-center justify-center font-black text-pink-400 text-xs">🌸</div>
            </div>
            <div class="w-8 h-[1px] bg-[#26153d]"></div>
            <div class="flex flex-col space-y-3 items-center">
                <div class="w-8 h-8 bg-[#140b24]/90 rounded-xl border border-[#2d184d] flex items-center justify-center text-xs relative group" title="Whisper ASR Active">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                </div>
                <div class="w-8 h-8 bg-[#140b24]/90 rounded-xl border border-[#2d184d] flex items-center justify-center text-xs relative group" title="TTS Voice Ready">
                    <span id="tts-status-dot" class="w-2 h-2 rounded-full bg-pink-400"></span>
                </div>
            </div>
        </div>
        <div class="flex flex-col space-y-2 items-center w-full px-1">
            <button id="install-ios-btn" class="w-9 h-9 bg-emerald-600/10 text-emerald-300 rounded-xl border border-emerald-500/30 flex items-center justify-center transition" title="iPhone PWA">
                <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
            </button>
            <button id="open-settings-btn" class="w-9 h-9 bg-pink-600/10 text-pink-300 rounded-xl border border-pink-500/30 flex items-center justify-center transition" title="Settings">
                <svg class="w-4 h-4 text-pink-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
            </button>
        </div>
    </aside>

    <!-- Main Viewport -->
    <main class="flex-1 relative h-full w-full overflow-hidden bg-[#050308]">
        <canvas id="matrix-canvas" class="absolute inset-0 w-full h-full pointer-events-none opacity-40 z-0"></canvas>
        <div id="vrm-canvas-holder" class="absolute inset-0 w-full h-full z-10">
            <div id="stage-loading" class="absolute inset-0 flex flex-col items-center justify-center bg-[#090512]/90 z-20 text-xs text-pink-300 space-y-3">
                <div class="w-8 h-8 border-2 border-pink-500 border-t-transparent rounded-full animate-spin"></div>
                <span class="font-bold tracking-widest uppercase">Summoning Cute Anime Suki...</span>
            </div>
        </div>

        <!-- Top Bar -->
        <div class="absolute top-4 left-4 right-4 z-20 flex flex-wrap items-center justify-between gap-3 pointer-events-none">
            <div class="glass px-4 py-2 rounded-2xl border border-pink-500/40 flex items-center space-x-3 shadow-2xl pointer-events-auto shrink-0">
                <span class="w-3.5 h-3.5 rounded-full bg-pink-500 animate-ping"></span>
                <div>
                    <span class="font-black text-sm text-white tracking-wider">SUKI</span>
                    <span class="text-xs text-pink-400 ml-2 font-mono font-semibold">CUTE ANIME GIRL</span>
                </div>
            </div>
            <div class="glass p-1.5 rounded-2xl border border-purple-500/40 flex items-center space-x-1.5 pointer-events-auto shadow-2xl shrink-0">
                <label for="vrm-file-input" class="cursor-pointer hover:bg-pink-600/20 text-pink-200 text-xs px-3 py-1.5 rounded-xl transition flex items-center space-x-1.5">
                    <svg class="w-4 h-4 text-pink-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    <span>Load .VRM</span>
                </label>
                <input id="vrm-file-input" type="file" accept=".vrm,.gltf,.glb" class="hidden">
            </div>
        </div>

        <!-- Chat Sub-Window -->
        <div id="chat-subwindow" class="absolute bottom-4 right-4 w-72 sm:w-80 h-[340px] bg-[#0d071b]/95 backdrop-blur-xl border border-pink-500/40 rounded-2xl shadow-2xl flex flex-col z-40 overflow-hidden">
            <div class="px-3 py-2 bg-[#170c2e]/95 border-b border-pink-500/20 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <div class="w-5 h-5 rounded-full ninja-gradient flex items-center justify-center font-black text-[9px] text-white">🌸</div>
                    <span class="font-bold text-xs text-pink-100 tracking-wide">SUKI CHAT</span>
                </div>
                <button id="clear-chat-btn" class="p-1 text-pink-300/70 hover:text-pink-300 transition" title="Clear Chat">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
            </div>
            <div id="chat-messages" class="flex-1 overflow-y-auto p-3 space-y-2.5 text-xs">
                <div class="flex space-x-2">
                    <div class="w-6 h-6 rounded-full bg-pink-600 shrink-0 flex items-center justify-center font-black text-xs text-white">🌸</div>
                    <div class="bg-[#1e1136]/90 border border-pink-500/30 p-2.5 rounded-xl text-pink-100 leading-snug shadow-md">
                        <span class="text-pink-400 font-bold uppercase tracking-wider block text-[10px] mb-0.5">Suki 🌸</span>
                        Hello Master! I'm your cute anime companion, ready to chat and help out! ✨
                    </div>
                </div>
            </div>
            <div class="p-2.5 bg-[#130b24]/90 border-t border-pink-500/20">
                <form id="chat-form" class="flex space-x-2">
                    <input id="chat-input" type="text" placeholder="Talk to Suki..." class="flex-1 bg-[#1a0f30] border border-pink-500/30 focus:border-pink-400 rounded-xl px-3 py-2 text-xs text-white focus:outline-none transition">
                    <button type="submit" class="ninja-gradient hover:opacity-90 px-3.5 py-2 rounded-xl font-bold text-xs text-white shadow-lg transition">Send</button>
                </form>
            </div>
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-[#140b24] border border-pink-500/30 w-full max-w-md rounded-2xl p-6 space-y-4 shadow-2xl">
            <h3 class="text-base font-bold text-white flex items-center justify-between">
                <span>Settings</span>
                <button id="close-settings-btn" class="text-pink-300 hover:text-white text-lg">×</button>
            </h3>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-pink-200 mb-1 font-medium">Gemini LLM Model</label>
                    <select id="gemini-model-select" class="w-full bg-[#1e1136] border border-pink-500/30 rounded-lg p-2.5 text-white">
                        <option value="gemini-3.8-flash">gemini-3.8-flash</option>
                    </select>
                </div>
                <div>
                    <label class="block text-pink-200 mb-1 font-medium">Gemini API Key</label>
                    <input id="gemini-key-input" type="password" placeholder="AIzaSy..." class="w-full bg-[#1e1136] border border-pink-500/30 rounded-lg p-2.5 text-white">
                </div>
            </div>
            <button id="save-settings-btn" class="w-full py-2.5 ninja-gradient rounded-xl font-bold text-xs text-white shadow-lg">Save & Apply</button>
        </div>
    </div>

    <!-- Script -->
    <script>
        let scene, camera, renderer, clock, currentVrm;
        let sukiAvatarGroup, sukiMouth, sukiHairBunsGroup;
        let isAvatarSpeaking = false;
        let matrixCanvas, matrixCtx, matrixColumns, matrixDrops;
        const matrixChars = "SUKI0123456789🌸✨💖⭐💫";

        function initMatrixRain() {
            matrixCanvas = document.getElementById('matrix-canvas');
            if (!matrixCanvas) return;
            matrixCtx = matrixCanvas.getContext('2d');
            function resizeMatrix() {
                matrixCanvas.width = window.innerWidth;
                matrixCanvas.height = window.innerHeight;
                matrixColumns = Math.floor(matrixCanvas.width / 14);
                matrixDrops = [];
                for (let i = 0; i < matrixColumns; i++) matrixDrops[i] = Math.floor(Math.random() * -50);
            }
            resizeMatrix();
            window.addEventListener('resize', resizeMatrix);
        }

        function drawMatrixRain() {
            if (!matrixCtx || !matrixCanvas) return;
            matrixCtx.fillStyle = 'rgba(5, 3, 8, 0.08)';
            matrixCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
            matrixCtx.font = '14px monospace';

            for (let i = 0; i < matrixDrops.length; i++) {
                const char = matrixChars[Math.floor(Math.random() * matrixChars.length)];
                matrixCtx.fillStyle = Math.random() > 0.92 ? '#f0abfc' : '#a855f7';
                matrixCtx.fillText(char, i * 14, matrixDrops[i] * 14);
                if (matrixDrops[i] * 14 > matrixCanvas.height && Math.random() > 0.975) matrixDrops[i] = 0;
                matrixDrops[i]++;
            }
        }

        function createProceduralCuteAnimeAvatar() {
            if (sukiAvatarGroup) scene.remove(sukiAvatarGroup);
            sukiAvatarGroup = new THREE.Group();

            const skinMat = new THREE.MeshStandardMaterial({ color: 0xfff5f0, roughness: 0.35 });
            const hairMat = new THREE.MeshStandardMaterial({ color: 0xff69b4, roughness: 0.3 });
            const outfitMat = new THREE.MeshStandardMaterial({ color: 0x1e1136, roughness: 0.25 });
            const shirtMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff1493 });
            const mouthMat = new THREE.MeshBasicMaterial({ color: 0x9c0024 });

            // Torso
            const torsoMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.48, 0.62, 1.3, 32), outfitMat);
            torsoMesh.position.y = 1.45;
            sukiAvatarGroup.add(torsoMesh);

            // Collar & Shirt
            const collarMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.42, 0.35, 32), shirtMat);
            collarMesh.position.y = 1.95;
            sukiAvatarGroup.add(collarMesh);

            // Head
            const headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.66, 32, 32), skinMat);
            headMesh.position.set(0, 2.5, 0.05);
            sukiAvatarGroup.add(headMesh);

            // Hair
            const hairTopMesh = new THREE.Mesh(new THREE.SphereGeometry(0.73, 32, 32), hairMat);
            hairTopMesh.position.set(0, 2.58, 0.02);
            sukiAvatarGroup.add(hairTopMesh);

            // Cute Hair Buns (Twin Buns / Odango style)
            sukiHairBunsGroup = new THREE.Group();
            const bunGeo = new THREE.SphereGeometry(0.22, 16, 16);
            const leftBun = new THREE.Mesh(bunGeo, hairMat);
            leftBun.position.set(-0.6, 3.1, 0);
            const rightBun = new THREE.Mesh(bunGeo, hairMat);
            rightBun.position.set(0.6, 3.1, 0);
            sukiHairBunsGroup.add(leftBun);
            sukiHairBunsGroup.add(rightBun);
            sukiAvatarGroup.add(sukiHairBunsGroup);

            // Eyes
            const eyeGeo = new THREE.SphereGeometry(0.13, 16, 16);
            eyeGeo.scale(1.0, 1.35, 0.4);
            const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
            leftEye.position.set(-0.24, 2.56, 0.58);
            const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
            rightEye.position.set(0.24, 2.56, 0.58);
            sukiAvatarGroup.add(leftEye);
            sukiAvatarGroup.add(rightEye);

            // Mouth
            sukiMouth = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), mouthMat);
            sukiMouth.position.set(0, 2.32, 0.62);
            sukiMouth.scale.set(1.1, 0.2, 0.4);
            sukiAvatarGroup.add(sukiMouth);

            sukiAvatarGroup.scale.set(0.33, 0.33, 0.33);
            scene.add(sukiAvatarGroup);

            const loaderEl = document.getElementById('stage-loading');
            if (loaderEl) loaderEl.style.display = 'none';
        }

        function initScene() {
            const container = document.getElementById('vrm-canvas-holder');
            if (!container) return;

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 0.8, 2.2);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            clock = new THREE.Clock();
            scene.add(new THREE.AmbientLight(0xffffff, 0.95));
            
            const dirLight = new THREE.DirectionalLight(0xff69b4, 1.4);
            dirLight.position.set(2, 4, 3);
            scene.add(dirLight);

            if (typeof THREE.OrbitControls !== 'undefined') {
                const controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.target.set(0, 0.5, 0);
            }

            createProceduralCuteAnimeAvatar();
            window.addEventListener('resize', () => {
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock ? clock.getElapsedTime() : Date.now() * 0.001;
            drawMatrixRain();

            if (sukiAvatarGroup) {
                sukiAvatarGroup.position.y = Math.sin(elapsedTime * 2) * 0.02;
                if (sukiHairBunsGroup) sukiHairBunsGroup.rotation.z = Math.sin(elapsedTime * 3) * 0.02;
            }

            if (isAvatarSpeaking && sukiMouth) {
                sukiMouth.scale.y = 0.2 + Math.abs(Math.sin(elapsedTime * 15)) * 0.8;
            } else if (sukiMouth) {
                sukiMouth.scale.y = 0.2;
            }

            if (renderer && scene && camera) renderer.render(scene, camera);
        }

        window.onload = function() {
            initMatrixRain();
            initScene();
        };

        const handleFileUpload = (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const statusLoader = document.getElementById('stage-loading');
            if (statusLoader) {
                statusLoader.style.display = 'flex';
                statusLoader.querySelector('span').textContent = `Installing VRM (${file.name})...`;
            }

            const reader = new FileReader();
            reader.onload = function (e) {
                const loader = new THREE.GLTFLoader();
                if (window.THREE && THREE.VRM?.VRMLoaderPlugin) {
                    loader.register((parser) => new THREE.VRM.VRMLoaderPlugin(parser));
                }
                loader.parse(e.target.result, '', (gltf) => {
                    if (sukiAvatarGroup) scene.remove(sukiAvatarGroup);
                    sukiAvatarGroup = gltf.userData.vrm ? gltf.userData.vrm.scene : gltf.scene;
                    sukiAvatarGroup.scale.set(0.33, 0.33, 0.33);
                    scene.add(sukiAvatarGroup);
                    if (statusLoader) statusLoader.style.display = 'none';
                    appendSukiReply(`🎉 Successfully loaded VRM model "${file.name}"!`);
                }, () => {
                    if (statusLoader) statusLoader.style.display = 'none';
                    appendSukiReply(`⚠️ Error parsing VRM file.`);
                });
            };
            reader.readAsArrayBuffer(file);
        };

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('vrm-file-input')?.addEventListener('change', handleFileUpload);
            const settingsModal = document.getElementById('settings-modal');
            document.getElementById('open-settings-btn')?.addEventListener('click', () => settingsModal.classList.remove('hidden'));
            document.getElementById('close-settings-btn')?.addEventListener('click', () => settingsModal.classList.add('hidden'));
            document.getElementById('save-settings-btn')?.addEventListener('click', () => {
                settingsModal.classList.add('hidden');
                appendSukiReply("Settings saved successfully!");
            });

            document.getElementById('clear-chat-btn')?.addEventListener('click', () => {
                document.getElementById('chat-messages').innerHTML = `
                    <div class="flex space-x-2">
                        <div class="w-6 h-6 rounded-full ninja-gradient shrink-0 flex items-center justify-center font-black text-[10px] text-white">🌸</div>
                        <div class="bg-[#1e1136]/90 border border-pink-500/30 p-3 rounded-xl text-pink-100 leading-relaxed shadow-md">
                            Chat reset. <span class="text-pink-400 font-black">SUKI</span> is listening...
                        </div>
                    </div>`;
            });

            document.getElementById('chat-form')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const input = document.getElementById('chat-input');
                const text = input ? input.value.trim() : '';
                if (!text) return;

                const chatMessages = document.getElementById('chat-messages');
                chatMessages.insertAdjacentHTML('beforeend', `
                    <div class="flex justify-end">
                        <div class="bg-pink-600/30 border border-pink-400/40 p-2.5 rounded-xl text-white max-w-[85%] leading-relaxed shadow-sm">
                            ${text}
                        </div>
                    </div>`);
                input.value = '';
                chatMessages.scrollTop = chatMessages.scrollHeight;

                const apiKey = document.getElementById('gemini-key-input')?.value.trim() || '';
                const modelName = document.getElementById('gemini-model-select')?.value || 'gemini-3.8-flash';

                if (apiKey) {
                    try {
                        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: `You are Suki, a cute young anime girl companion. Speak sweetly and cheerfully. User says: ${text}` }] }]
                            })
                        });
                        const data = await res.json();
                        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Failed to connect to Gemini API!";
                        appendSukiReply(reply);
                        return;
                    } catch (err) {
                        console.error(err);
                    }
                }

                setTimeout(() => {
                    const responses = [
                        `Hehe, "${text}" sounds really fun, Master! ✨`,
                        `I'm listening closely to "${text}"! 🌸`,
                        `That's so interesting! Tell me more about "${text}"! 💕`
                    ];
                    appendSukiReply(responses[Math.floor(Math.random() * responses.length)]);
                }, 500);
            });
        });

        function appendSukiReply(reply) {
            const chatMessages = document.getElementById('chat-messages');
            if (!chatMessages) return;

            chatMessages.insertAdjacentHTML('beforeend', `
                <div class="flex space-x-2">
                    <div class="w-6 h-6 rounded-full ninja-gradient shrink-0 flex items-center justify-center font-black text-[10px] text-white">🌸</div>
                    <div class="bg-[#1e1136]/90 border border-pink-500/30 p-2.5 rounded-xl text-pink-100 leading-relaxed shadow-md">
                        <span class="text-pink-400 font-bold block mb-0.5">SUKI</span>
                        ${reply}
                    </div>
                </div>`);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(reply.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, ''));
                utterance.rate = 1.0;
                utterance.pitch = 1.45;
                utterance.volume = 0.85;
                utterance.onstart = () => { isAvatarSpeaking = true; };
                utterance.onend = () => { isAvatarSpeaking = false; };
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
