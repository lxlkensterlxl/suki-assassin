    <script>
        let scene, camera, renderer, clock, controls, currentVrm;
        let sukiAvatarGroup, sukiMouth, sukiHairBunsGroup;
        let isAvatarSpeaking = false;
        let matrixCanvas, matrixCtx, matrixColumns, matrixDrops;
        const matrixChars = "SUKI0123456789🌸✨💖⭐💫";
        const STORAGE_KEYS = {
            apiKey: 'suki_gemini_api_key',
            model: 'suki_gemini_model'
        };

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function renderMarkdownSafe(markdownText) {
            const rawHtml = typeof marked !== 'undefined'
                ? marked.parse(String(markdownText))
                : `<p>${escapeHtml(markdownText)}</p>`;

            const template = document.createElement('template');
            template.innerHTML = rawHtml;

            template.content.querySelectorAll('script, iframe, object, embed, link, style').forEach((el) => el.remove());
            template.content.querySelectorAll('*').forEach((el) => {
                for (const attr of [...el.attributes]) {
                    const name = attr.name.toLowerCase();
                    const val = attr.value.trim().toLowerCase();
                    if (name.startsWith('on') || ((name === 'href' || name === 'src') && val.startsWith('javascript:'))) {
                        el.removeAttribute(attr.name);
                    }
                }
            });

            return template.innerHTML;
        }

        function initMatrixRain() {
            matrixCanvas = document.getElementById('matrix-canvas');
            if (!matrixCanvas) return;
            matrixCtx = matrixCanvas.getContext('2d');
            function resizeMatrix() {
                matrixCanvas.width = window.innerWidth;
                matrixCanvas.height = window.innerHeight;
                matrixColumns = Math.max(1, Math.floor(matrixCanvas.width / 14));
                matrixDrops = Array.from({ length: matrixColumns }, () => Math.floor(Math.random() * -50));
            }
            resizeMatrix();
            window.addEventListener('resize', resizeMatrix);
        }

        function drawMatrixRain() {
            if (!matrixCtx || !matrixCanvas || !matrixDrops) return;
            matrixCtx.fillStyle = 'rgba(5, 3, 8, 0.08)';
            matrixCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
            matrixCtx.font = '14px monospace';

            for (let i = 0; i < matrixDrops.length; i++) {
                const char = matrixChars[Math.floor(Math.random() * matrixChars.length)];
                matrixCtx.fillStyle = Math.random() > 0.92 ? '#f0abfc' : '#a855f7';
                matrixCtx.fillText(char, i * 14, matrixDrops[i] * 14);
                if (matrixDrops[i] * 14 > matrixCanvas.height && Math.random() > 0.975) matrixDrops[i] = 0;
                matrixDrops[i]++;
            }
        }

        function createProceduralCuteAnimeAvatar() {
            currentVrm = null;
            if (sukiAvatarGroup && scene) scene.remove(sukiAvatarGroup);
            sukiAvatarGroup = new THREE.Group();

            const skinMat = new THREE.MeshStandardMaterial({ color: 0xfff5f0, roughness: 0.35 });
            const hairMat = new THREE.MeshStandardMaterial({ color: 0xff69b4, roughness: 0.3 });
            const outfitMat = new THREE.MeshStandardMaterial({ color: 0x1e1136, roughness: 0.25 });
            const shirtMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff1493 });
            const mouthMat = new THREE.MeshBasicMaterial({ color: 0x9c0024 });

            const torsoMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.48, 0.62, 1.3, 32), outfitMat);
            torsoMesh.position.y = 1.45;
            sukiAvatarGroup.add(torsoMesh);

            const collarMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.42, 0.35, 32), shirtMat);
            collarMesh.position.y = 1.95;
            sukiAvatarGroup.add(collarMesh);

            const headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.66, 32, 32), skinMat);
            headMesh.position.set(0, 2.5, 0.05);
            sukiAvatarGroup.add(headMesh);

            const hairTopMesh = new THREE.Mesh(new THREE.SphereGeometry(0.73, 32, 32), hairMat);
            hairTopMesh.position.set(0, 2.58, 0.02);
            sukiAvatarGroup.add(hairTopMesh);

            sukiHairBunsGroup = new THREE.Group();
            const bunGeo = new THREE.SphereGeometry(0.22, 16, 16);
            const leftBun = new THREE.Mesh(bunGeo, hairMat);
            leftBun.position.set(-0.6, 3.1, 0);
            const rightBun = new THREE.Mesh(bunGeo, hairMat);
            rightBun.position.set(0.6, 3.1, 0);
            sukiHairBunsGroup.add(leftBun, rightBun);
            sukiAvatarGroup.add(sukiHairBunsGroup);

            const eyeGeo = new THREE.SphereGeometry(0.13, 16, 16);
            eyeGeo.scale(1.0, 1.35, 0.4);
            const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
            leftEye.position.set(-0.24, 2.56, 0.58);
            const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
            rightEye.position.set(0.24, 2.56, 0.58);
            sukiAvatarGroup.add(leftEye, rightEye);

            sukiMouth = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), mouthMat);
            sukiMouth.position.set(0, 2.32, 0.62);
            sukiMouth.scale.set(1.1, 0.2, 0.4);
            sukiAvatarGroup.add(sukiMouth);

            sukiAvatarGroup.scale.set(0.33, 0.33, 0.33);
            sukiAvatarGroup.position.set(0, 0, 0);
            scene.add(sukiAvatarGroup);

            const loaderEl = document.getElementById('stage-loading');
            if (loaderEl) loaderEl.style.display = 'none';
        }

        function setAvatarModel(object3D, vrmInstance = null) {
            if (sukiAvatarGroup && scene) scene.remove(sukiAvatarGroup);
            currentVrm = vrmInstance || null;
            sukiAvatarGroup = object3D;
            sukiHairBunsGroup = null;
            sukiMouth = null;

            if (currentVrm && THREE.VRMUtils?.rotateVRM0) {
                THREE.VRMUtils.rotateVRM0(currentVrm);
            }
            if (!currentVrm) {
                sukiAvatarGroup.scale.set(0.33, 0.33, 0.33);
            }
            scene.add(sukiAvatarGroup);
            window.sukiStage?.attach(sukiAvatarGroup, currentVrm);
        }

        function initScene() {
            const container = document.getElementById('vrm-canvas-holder');
            if (!container) return;

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 0.9, 2.2);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            clock = new THREE.Clock();
            scene.add(new THREE.AmbientLight(0xffffff, 0.95));

            const dirLight = new THREE.DirectionalLight(0xff69b4, 1.4);
            dirLight.position.set(2, 4, 3);
            scene.add(dirLight);

            if (typeof THREE.OrbitControls !== 'undefined') {
                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.target.set(0, 0.75, 0);
            }

            createProceduralCuteAnimeAvatar();
            window.dispatchEvent(new Event('suki-scene-ready'));

            window.addEventListener('resize', () => {
                if (!container.clientWidth || !container.clientHeight) return;
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock ? clock.getDelta() : 0.016;
            const elapsedTime = clock ? clock.elapsedTime : Date.now() * 0.001;

            drawMatrixRain();
            if (controls) controls.update();

            if (currentVrm) {
                if (isAvatarSpeaking && currentVrm.blendShapeProxy) {
                    const lipWeight = 0.25 + Math.abs(Math.sin(elapsedTime * 16)) * 0.65;
                    currentVrm.blendShapeProxy.setValue('A', lipWeight);
                } else if (currentVrm.blendShapeProxy) {
                    currentVrm.blendShapeProxy.setValue('A', 0);
                }
                currentVrm.update(delta);
            } else {
                if (sukiAvatarGroup) {
                    sukiAvatarGroup.position.y = Math.sin(elapsedTime * 2) * 0.02;
                    if (sukiHairBunsGroup) sukiHairBunsGroup.rotation.z = Math.sin(elapsedTime * 3) * 0.02;
                }
                if (isAvatarSpeaking && sukiMouth) {
                    sukiMouth.scale.y = 0.2 + Math.abs(Math.sin(elapsedTime * 15)) * 0.8;
                } else if (sukiMouth) {
                    sukiMouth.scale.y = 0.2;
                }
            }

            if (renderer && scene && camera) renderer.render(scene, camera);
        }

        const handleFileUpload = (event) => {
            const file = event.target.files?.[0];
            if (!file) return;

            const statusLoader = document.getElementById('stage-loading');
            if (statusLoader) {
                statusLoader.style.display = 'flex';
                const label = statusLoader.querySelector('span');
                if (label) label.textContent = `Installing VRM (${file.name})...`;
            }

            const reader = new FileReader();
            reader.onload = function (e) {
                const loader = new THREE.GLTFLoader();
                loader.parse(e.target.result, '', async (gltf) => {
                    try {
                        if (window.THREE?.VRM?.from) {
                            const vrm = await THREE.VRM.from(gltf);
                            setAvatarModel(vrm.scene, vrm);
                        } else {
                            setAvatarModel(gltf.scene, null);
                        }
                        if (statusLoader) statusLoader.style.display = 'none';
                        appendSukiReply(`🎉 Successfully loaded VRM model "${file.name}"!`);
                    } catch (err) {
                        console.error(err);
                        if (statusLoader) statusLoader.style.display = 'none';
                        appendSukiReply(`⚠️ Could not initialize VRM metadata for "${file.name}".`);
                    }
                }, (err) => {
                    console.error(err);
                    if (statusLoader) statusLoader.style.display = 'none';
                    appendSukiReply(`⚠️ Error parsing VRM file.`);
                });
            };
            reader.readAsArrayBuffer(file);
            event.target.value = '';
        };

        function appendUserMessage(text) {
            const chatMessages = document.getElementById('chat-messages');
            if (!chatMessages) return;

            chatMessages.insertAdjacentHTML('beforeend', `
                <div class="flex justify-end">
                    <div class="bg-pink-600/30 border border-pink-400/30 p-2.5 rounded-xl text-white leading-snug max-w-[85%]">
                        ${escapeHtml(text)}
                    </div>
                </div>`);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function appendSukiReply(reply) {
            const chatMessages = document.getElementById('chat-messages');
            if (!chatMessages) return;

            const renderedHtml = renderMarkdownSafe(reply);

            chatMessages.insertAdjacentHTML('beforeend', `
                <div class="flex space-x-2">
                    <div class="w-6 h-6 rounded-full ninja-gradient shrink-0 flex items-center justify-center font-black text-[10px] text-white">🌸</div>
                    <div class="bg-[#1e1136]/90 border border-pink-500/30 p-2.5 rounded-xl text-pink-100 leading-relaxed shadow-md prose-suki">
                        <span class="text-pink-400 font-bold block mb-0.5">SUKI</span>
                        ${renderedHtml}
                    </div>
                </div>`);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const cleanText = String(reply)
                    .replace(/```[\s\S]*?```/g, ' ')
                    .replace(/[*_`#>-]/g, ' ')
                    .replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '');
                if (cleanText.trim()) {
                    const utterance = new SpeechSynthesisUtterance(cleanText.trim());
                    utterance.rate = 1.0;
                    utterance.pitch = 1.45;
                    utterance.volume = 0.85;
                    window.sukiStage?.bindSpeechUtterance(utterance);
                    utterance.addEventListener('start', () => { isAvatarSpeaking = true; });
                    utterance.addEventListener('end', () => { isAvatarSpeaking = false; });
                    utterance.addEventListener('error', () => { isAvatarSpeaking = false; });
                    window.speechSynthesis.speak(utterance);
                }
            }
        }

        async function askGemini(promptText) {
            const apiKey = localStorage.getItem(STORAGE_KEYS.apiKey)?.trim();
            const model = localStorage.getItem(STORAGE_KEYS.model) || 'gemini-2.5-flash';

            if (!apiKey) {
                appendSukiReply('Please set your **Gemini API Key** in Settings first! ✨');
                return;
            }

            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`;
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    systemInstruction: {
                        parts: [{ text: 'You are Suki, a cheerful, helpful cute anime AI companion. Keep replies concise and friendly.' }]
                    },
                    contents: [{
                        role: 'user',
                        parts: [{ text: promptText }]
                    }]
                })
            });

            if (!response.ok) {
                const errText = await response.text();
                throw new Error(`Gemini API error (${response.status}): ${errText}`);
            }

            const data = await response.json();
            const replyText = data?.candidates?.[0]?.content?.parts
                ?.map((p) => p.text)
                .filter(Boolean)
                .join('\n') || 'Hmm, I drew a blank! Try asking again.';

            appendSukiReply(replyText);
        }

        window.addEventListener('DOMContentLoaded', () => {
            initMatrixRain();
            initScene();

            const vrmInput = document.getElementById('vrm-file-input');
            if (vrmInput) vrmInput.addEventListener('change', handleFileUpload);

            const chatForm = document.getElementById('chat-form');
            const chatInput = document.getElementById('chat-input');
            if (chatForm && chatInput) {
                chatForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const text = chatInput.value.trim();
                    if (!text) return;
                    chatInput.value = '';
                    appendUserMessage(text);
                    try {
                        await askGemini(text);
                    } catch (err) {
                        console.error(err);
                        appendSukiReply(`⚠️ ${escapeHtml(err.message)}`);
                    }
                });
            }

            const clearChatBtn = document.getElementById('clear-chat-btn');
            const chatMessages = document.getElementById('chat-messages');
            if (clearChatBtn && chatMessages) {
                clearChatBtn.addEventListener('click', () => {
                    window.speechSynthesis?.cancel();
                    isAvatarSpeaking = false;
                    chatMessages.innerHTML = `
                        <div class="flex space-x-2">
                            <div class="w-6 h-6 rounded-full bg-pink-600 shrink-0 flex items-center justify-center font-black text-xs text-white">🌸</div>
                            <div class="bg-[#1e1136]/90 border border-pink-500/30 p-2.5 rounded-xl text-pink-100 leading-snug shadow-md">
                                <span class="text-pink-400 font-bold uppercase tracking-wider block text-[10px] mb-0.5">Suki 🌸</span>
                                Chat cleared! What's next, Master? ✨
                            </div>
                        </div>`;
                });
            }

            const settingsModal = document.getElementById('settings-modal');
            const openSettingsBtn = document.getElementById('open-settings-btn');
            const closeSettingsBtn = document.getElementById('close-settings-btn');
            const saveSettingsBtn = document.getElementById('save-settings-btn');
            const modelSelect = document.getElementById('gemini-model-select');
            const keyInput = document.getElementById('gemini-key-input');

            if (modelSelect && localStorage.getItem(STORAGE_KEYS.model)) {
                modelSelect.value = localStorage.getItem(STORAGE_KEYS.model);
            }
            if (keyInput && localStorage.getItem(STORAGE_KEYS.apiKey)) {
                keyInput.value = localStorage.getItem(STORAGE_KEYS.apiKey);
            }

            openSettingsBtn?.addEventListener('click', () => settingsModal?.classList.remove('hidden'));
            closeSettingsBtn?.addEventListener('click', () => settingsModal?.classList.add('hidden'));
            saveSettingsBtn?.addEventListener('click', () => {
                if (modelSelect) localStorage.setItem(STORAGE_KEYS.model, modelSelect.value);
                if (keyInput) localStorage.setItem(STORAGE_KEYS.apiKey, keyInput.value.trim());
                settingsModal?.classList.add('hidden');
                appendSukiReply('Settings saved! 🌸');
            });
        });
    </script>
</body>
</html>
